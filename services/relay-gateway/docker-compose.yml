# FairWins relayer stack — local development wiring (spec 036).
#
#   relay-gateway  (this service; FairWins policy)  :8788
#   oz-relayer     (OpenZeppelin Relayer engine)    :8080
#   redis          (engine queue store; also the gateway's Phase-2 shared limiter/dedup store)
#
# Secrets come from a local `.env` (copy .env.example -> .env) — never commit `.env`.
# Production runs the gateway on Cloud Run behind the Cloudflare 451 geo-gate + origin-lock;
# this compose file is for local validation only (quickstart.md).
#
# Run from this directory:  docker compose up --build
services:
  relay-gateway:
    build:
      context: ../..                          # repo root: the image bakes in deployments/ (FR-025)
      dockerfile: services/relay-gateway/Dockerfile
    image: fairwins-relay-gateway:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENGINE_URL: http://oz-relayer:8080
    ports:
      - "${PORT:-8788}:${PORT:-8788}"
    depends_on:
      - oz-relayer
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  oz-relayer:
    # LOCAL BUILD (#1660). OpenZeppelin publishes NO pullable image (ghcr answers 403 on every tag), so
    # the old `ghcr.io/openzeppelin/openzeppelin-relayer:v1.4.0` here never worked. This builds the
    # config-baked FairWins engine image from ../oz-relayer/Dockerfile, whose FROM names our private
    # Artifact Registry base. The additional_contexts entry below swaps that FROM for a LOCAL image
    # tagged openzeppelin-relayer:v1.4.0, so you build the base once from upstream and need no
    # registry access (the Dockerfile itself is untouched, so production builds are unaffected):
    #
    #   git clone --depth 1 --branch v1.4.0 https://github.com/OpenZeppelin/openzeppelin-relayer ozr
    #   DOCKER_BUILDKIT=1 docker build -f ozr/Dockerfile.production -t openzeppelin-relayer:v1.4.0 ozr
    #   docker compose up --build
    #
    # The first build is a Rust compile (slow, a few GB of cache). Keep the tag at v1.4.0 while the engine
    # is held there (ADR-006, issue #1648); changing it is a version bump and goes through
    # services/oz-relayer/README.md "Version pin". Not exercised in CI: the sandbox that wrote this had
    # no Docker daemon, so the first real build is the verification.
    build:
      context: ../oz-relayer
      dockerfile: Dockerfile
      additional_contexts:
        us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/fairwins-relay-engine-base:v1.4.0: docker-image://openzeppelin-relayer:v1.4.0
    # No `image:` key on purpose: compose names the build `<project>-oz-relayer`, and the version-pin
    # gate (scripts/deps/check-version-pins.js) would otherwise demand a registry entry for a local tag.
    restart: unless-stopped
    volumes:
      - ../oz-relayer/config:/app/config:ro
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      GATEWAY_WEBHOOK_URL: http://relay-gateway:8788/v1/engine/webhook
    ports:
      - "8080:8080"
    depends_on:
      - redis

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # ephemeral by design: state is reconstructed from chain
    ports:
      - "6379:6379"
