# infra/vm/gateway/docker-compose.yml — FairWins policy gateway + OZ Relayer engine + redis on GCE.
#
# NETWORK MODEL: engine and redis join the gateway's network namespace
# (`network_mode: "service:gateway"`), reproducing Cloud Run's sidecar namespace exactly. This is what
# makes ALL FOUR localhost couplings correct VERBATIM, with no config rewriting:
#   ENGINE_URL=http://localhost:8080                                        (this file)
#   REDIS_URL=redis://localhost:6379                                        (this file)
#   config.json:46 "url": "http://localhost:8788/v1/engine/webhook"         (engine -> gateway)
#   nginx upstream 127.0.0.1:3000                                           (bundler VM)
#
# The webhook one is why a bridge network is NOT acceptable here: rewriting it wrong fails SILENTLY —
# the engine POSTs confirmations into the void, the gateway never learns a tx landed, and intents
# report `submitted` forever with no chain fallback.
#
# Only the namespace OWNER (gateway) may declare `ports:`, and it publishes to LOOPBACK ONLY; the host
# nginx terminates TLS on :443 and proxies to 127.0.0.1:8788.
#
# Recreating the gateway invalidates the joiners' namespaces. ALWAYS act on the whole project
# (`systemctl restart fairwins-stack@gateway`), never `docker restart` a single container.
#
# Resource limits mirror the right-sized Cloud Run values (PR #1000). Measured 30d p99 for the whole
# instance: 0.196 vCPU / 0.31 GiB.
name: fairwins-gateway

services:
  # ---- namespace owner: the policy gateway (the only public surface) ----
  gateway:
    container_name: fairwins-gateway-gateway
    # spec109-7110b663 (#1544, spec-109 go-live): the first image carrying the token-news read
    # proxy (services/relay-gateway/src/news/). Verified before push, on the built image itself:
    # /status returns a `news` block ({enabled, killed, cacheTtlMs: 300000}) that the previous pin
    # spec107-1ac148bf does not, and GET /v1/news/137/native?slug=matic-network answered a `read`
    # envelope with live items. Digest sha256:1f5e5ca951fd16fbe6f6d7658834546e6232bfccae9056305…
    #
    # That `news` block is itself part of this build: newsStatus() shipped with 109 exported and
    # never called, so /status could not distinguish an image carrying the module from one
    # predating it — the pre-pin check the NEWS_ENABLED note below tells you to run had no signal
    # to read. Wiring it in is what makes the ritual performable, not a cosmetic addition.
    #
    # Carries everything the previous two pins did: spec 095's member API, spec 096's x402 rail,
    # the spec-089 FinOps catalogue work and the member-API quota/spend bounds from #1311; the
    # spec-107 keyed-RPC issuance; and the spec 082/083 perps proxy. ASSISTANT_ENABLED is still
    # off; see the flag block below for why that one is not a flag flip.
    image: us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/fairwins-relay-gateway:spec109-7110b663
    restart: unless-stopped
    pull_policy: missing
    ports:
      - "127.0.0.1:8788:8788"
    env_file:
      - /run/fairwins/gateway.env   # gateway credentials only. MUST NOT contain GCP_PRIVATE_KEY.
    volumes:
      # The SIGHUP reload source (spec 106 FR-014): env_file above is read by compose ON THE HOST
      # at container create; this read-only mount is what lets the RUNNING process re-read the
      # same file. ro on purpose — the gateway consumes configuration, it never writes it.
      - /run/fairwins/gateway.env:/run/fairwins/gateway.env:ro
    environment:
      PORT: "8788"
      ENABLED_CHAIN_IDS: "63,137"
      ALLOWED_ORIGINS: "https://fairwins.app"
      ENGINE_URL: "http://localhost:8080"        # correct verbatim — shared namespace
      ENGINE_RELAYER_ID_63: "mordor-63"
      GAS_WALLET_63: "0xf505d95F62bEE94437C112d3D64ee7Df0Fa973aC"
      RPC_URLS_63: "https://rpc.mordor.etccooperative.org,https://geth-mordor.etc-network.info"
      ENGINE_RELAYER_ID_137: "polygon-137"
      GAS_WALLET_137: "0x3BB28b184b8a748dE22aBD076634F85adADA82db"
      # PUBLIC FAILOVER ONLY. The primary is the keyed QuickNode archive endpoint, delivered as
      # RPC_URL_PRIMARY_137 in gateway.env and PREPENDED to this list by config/index.js — it is a
      # URL with the token in its path and must never be written here, where it would be in git.
      #
      # polygon.llamarpc.com was REMOVED, not replaced in place: measured 2026-08-23 it does not
      # resolve at all (`fetch failed`), so this had been a one-entry list wearing a failover's
      # clothes since some unknown date. polygon-rpc.com is NOT the replacement either — it now
      # answers 401 without a key. polygon.drpc.org was probed at the same time: HTTP 200,
      # chainId 137.
      RPC_URLS_137: "https://polygon-bor-rpc.publicnode.com,https://polygon.drpc.org"
      PAYMASTER_ADDRESS_137: "0xe14554D14eB5DeC47f7824ebeeDa6C9f3A50d105"
      PM_SIGNER_KMS_KEY: "projects/chippr-bots-site-wp/locations/us-central1/keyRings/fairwins-relayer/cryptoKeys/paymaster-signer-polygon/cryptoKeyVersions/1"
      OPENSEA_REFERRAL_ADDRESS: ""
      POLYMARKET_BUILDER_CODE: "0x6e0316783960e149b53466f0f2c5fdbaf5ce11ba15669491de980f6dedc493a3"
      POLYMARKET_BUILDER_TAKER_FEE_BPS: "50"
      POLYMARKET_BUILDER_MAKER_FEE_BPS: "0"
      # ---- Member API + assistant (spec 095) and x402 agentic payments (spec 096) ----
      # THE PIN HAS ADVANCED; THESE ARE STILL OFF BY CHOICE. The image above (agentic-096) DOES
      # carry the memberApi module — the note that used to sit here ("commented until the image pin
      # advances") outlived the repin and read as if code were missing when only a decision was.
      #
      # MEASURED ON THE LIVE GATEWAY 2026-08-26, and worth keeping because it is how you tell a
      # stale CONTAINER from a stale PIN: `GET /status` returned no `memberApi` block at all, every
      # `/v1/member/*` route 404'd from Express's default handler, and the response advertised
      # `Access-Control-Allow-Headers: Content-Type` where this repo's server.js sends
      # `Content-Type, Authorization`. All three say the running container predates the pin, so a
      # CONVERGE is required before any flag below can change anything observable.
      #
      # Turning ASSISTANT_ENABLED on in this committed file is ALSO a FinOps decision, by
      # construction: `assistant-model-api` is catalogued `planned`, and check:finops rule B3 fails
      # a planned money path that a committed deployment switches on. Promotion to `live` needs a
      # collector, which does not exist yet — so enabling it is that work, not a flag flip.
      # Enable procedure (image build → push → repin → uncomment → converge) is
      # docs/runbooks/member-api-operations.md §3.1 "Enable the Member API". The reference-chain
      # pin is LOAD-BEARING: ENABLED_CHAIN_IDS starts with 63, and the default reference chain is
      # the FIRST enabled chain with a recorded membershipManager — Mordor also has one, so leaving
      # this unset silently pins membership + ERC-1271 auth to testnet on a mainnet-serving gateway.
      # The 137 subgraph is pinned to a version, never /version/latest (networks.js precedent);
      # Mordor deliberately has no MEMBER_API_SUBGRAPH_63 — no subgraph exists there, and
      # `not-configured` is the honest answer. ANTHROPIC_API_KEY arrives via fetch-secrets
      # (optional): absent ⇒ the assistant route answers 503 assistant_unconfigured, nothing else
      # degrades.
      # ENABLED 2026-08-28. x402 needs MEMBER_API_ENABLED (its own status logic reports `enabled:
      # false` whenever the member API is off — the priced ops it sells access to ARE member-api
      # routes, so there is nothing to charge for without it). ASSISTANT_ENABLED stays OFF: turning
      # it on is a FinOps decision, not a flag flip (see the comment above) — `assistant-model-api`
      # is still catalogued `planned`, and check:finops rule B3 fails a planned money path a
      # committed deployment switches on. The x402 assistant PRICE class is harmless to leave
      # nonzero here: with no assistant ROUTE live, nothing can ever be billed for it.
      MEMBER_API_ENABLED: "true"
      MEMBER_API_REFERENCE_CHAIN_ID: "137"
      MEMBER_API_SUBGRAPH_137: "https://api.studio.thegraph.com/query/1755381/fairwins-polygon/v0.3.0"
      # ASSISTANT_ENABLED: "true"
      X402_ENABLED: "true"
      X402_CHAIN_ID: "137"
      # The estate's admin Safe (2-of-3), NOT the FeeRouter's own treasury() — that address is still
      # an individual owner's EOA on Polygon as of this commit (0x1215…8575; every other chain the
      # FeeRouter is deployed on already points at this Safe). Fixing the FeeRouter to match is a
      # separate Safe transaction (setTreasury), tracked independently — this repins x402 to where
      # revenue is MOVING, not where one specific router still happens to point today.
      X402_PAY_TO: "0xcf76db7aa9Fb1BFe08E010468F3344bB45830447"
      # ---- Bitcoin read/broadcast proxy (spec 061) ----
      # ENABLED 2026-08-30. The upstream is Esplora REST (public mempool.space — the config
      # default, stated explicitly so the choice is reviewable), NOT the QuickNode BTC endpoint:
      # QuickNode serves Bitcoin Core JSON-RPC/Blockbook, which this module's Esplora client does
      # not speak — swapping upstreams means an adapter, not a URL change. No money path and no
      # C2b impact: the platform takes no fee on BTC, sends are member-paid network fees, and the
      # module holds no credential (both upstreams are public/tokenless). The stamps indexer makes
      # Stamps VERIFY rather than fail-safe to protected-but-unspendable; if stampchain.io is
      # down, /stamps answers degraded:true and the client protects unverified coins (FR-019).
      BTC_ENABLED: "true"
      BTC_ESPLORA_URL: "https://mempool.space/api"
      BTC_STAMPS_URL: "https://stampchain.io"
      # ---- Caller identity (spec 106) — OBSERVE MODE ----
      # Two switches, deliberately (the spec's staged deploy): ENABLED resolves every caller's tier
      # and reports it (X-FairWins-Tier + the gated /status block) while changing NO status code;
      # ENFORCE is the second, separate step, taken only after the tier model has been watched
      # against real traffic. A safety layer that starts refusing the moment it deploys fails in
      # the shape "the product is broken" — so ENFORCE stays commented until observe-mode data
      # says otherwise. Both reload via SIGHUP (RELOAD_ENV_FILE below), no container replacement.
      IDENTITY_ENABLED: "true"
      # IDENTITY_ENFORCE: "true"
      # ---- Keyed RPC issuance (spec 107, #1469) ----
      # POST /v1/access/rpc mints short-lived READ-ONLY ES256 JWTs for the dedicated issuance
      # endpoint (657013 — provisioned and live-fire verified on #1468: one token spans all five
      # EVM mainnets, bare URL answers 401, eth_sendRawTransaction answers -32611 WITH a valid
      # token, expiry enforced). Credentials arrive via fetch-secrets (RPC_ACCESS_SIGNING_KEY +
      # RPC_ACCESS_ADMIN_KEY in gateway.env); with either absent this whole block is inert and the
      # route answers 503 access_unconfigured. The URLs below are PUBLIC information by design —
      # stand-alone mode means the URL carries no credential and only a valid JWT is served.
      # One endpoint id everywhere => the FR-026 enforcement verdict is checked once and its cache
      # serves all five chains.
      RPC_ACCESS_ENABLED: "true"
      RPC_ACCESS_SIGNING_KID: "k1"
      RPC_ACCESS_ENDPOINT_ID_1: "657013"
      RPC_ACCESS_ENDPOINT_URL_1: "https://small-white-general.quiknode.pro/"
      RPC_ACCESS_ENDPOINT_ID_10: "657013"
      RPC_ACCESS_ENDPOINT_URL_10: "https://small-white-general.optimism.quiknode.pro/"
      RPC_ACCESS_ENDPOINT_ID_137: "657013"
      RPC_ACCESS_ENDPOINT_URL_137: "https://small-white-general.matic.quiknode.pro/"
      RPC_ACCESS_ENDPOINT_ID_8453: "657013"
      RPC_ACCESS_ENDPOINT_URL_8453: "https://small-white-general.base-mainnet.quiknode.pro/"
      RPC_ACCESS_ENDPOINT_ID_42161: "657013"
      RPC_ACCESS_ENDPOINT_URL_42161: "https://small-white-general.arbitrum-mainnet.quiknode.pro/"
      # ---- Operability (specs 106/107) ----
      # SIGHUP re-reads the allowlisted operational switches from this file — which is the SAME
      # file env_file: reads at container create, mounted read-only below so the running process
      # can re-read it. Kill switches, enable flags and ceilings only; fund-path config
      # deliberately never reloads (policy/reload.js is the allowlist).
      RELOAD_ENV_FILE: "/run/fairwins/gateway.env"
      # Usage counters for the FinOps gateway-upstream-usage source (#1447): per-tier and
      # per-upstream request counts as JSON. Compose-network internal — this port is deliberately
      # NOT in ports: above and must never be published to the host.
      METRICS_PORT: "9091"
      # ---- Perps read proxy (specs 082 + 083) ----
      # READ-ONLY BY CONSTRUCTION: this module has no write route at all. It proxies three PUBLIC
      # venue APIs (Gains, GMX, Hyperliquid) for market data and a member's own positions, and holds
      # no credential of any kind. Enabling it does NOT enable trading — that is a separate
      # build-time SPA flag (VITE_PERPS_MANAGE_ENABLED, see the root Dockerfile), deliberately absent
      # from every cloudbuild so it can only be turned on on purpose.
      #
      # Until this is "true" the routes answer 503 perps_unconfigured and the SPA hides the view,
      # which is why the Perps surface has been invisible in production since spec 082 shipped.
      # REQUIRES an image containing the perps module: predict-058 PREDATES it (its /status has no
      # `perps` block), so this flag does nothing until the image tag above is bumped.
      PERPS_ENABLED: "true"
      # Hyperliquid builder-fee FALLBACK. The live source is the FeeRouter service
      # perps.hyperliquid.builder on Polygon (registered 2026-08-11, cap 10 bps, rate 0), which this
      # gateway already reads. Nothing is charged: Hyperliquid trading is not enabled.
      PERPS_HL_BUILDER_FEE_BPS: "0"
      # Attribution ids are PUBLIC config, never secrets, and are deliberately UNSET: no GMX referral
      # code is registered and Gains has not whitelisted a referrer, so link-outs go unattributed
      # rather than carrying a code that earns nothing. GMX's UI fee is NOT here — it rides on-chain
      # calldata from the SPA (uiFeeReceiver), never a gateway request.
      # PERPS_GAINS_REFERRER / PERPS_GMX_REF_CODE / PERPS_HL_BUILDER_ADDRESS: unset on purpose.
      # ---- Token news read proxy (spec 109) ----
      # READ-ONLY BY CONSTRUCTION, like perps above: no write route, no credential of any kind. It
      # proxies the KEYLESS Alphaday tags feed, which is why there is no NEWS_API_KEY to wire — the
      # vendor needs none, and it has no CORS, which is why the proxy exists at all rather than the
      # browser calling it directly.
      #
      # REQUIRES AN IMAGE CONTAINING THE NEWS MODULE — and as of the pin above it has one
      # (spec109-7110b663, #1544). This flag was inert from #1543 until that repin, because the
      # previous pin spec107-1ac148bf PREDATED spec 109: `/v1/news/*` did not exist there and
      # answered 404, not 503. The SPA reads a 404 as not-configured — absence, rendering nothing
      # — so that window was silent rather than showing every member a failure they could not act
      # on. Keep that branch: it is what makes the NEXT such window safe, not dead code.
      #
      # The rule survives the fix: before pinning any future tag, boot the image and confirm
      # /status carries a `news` block, exactly as the perps note above describes. A flag with no
      # code behind it looks enabled and does nothing.
      #
      # FinOps: the cost source `alphaday-news-api` is already catalogued LIVE (basis modelled, $0
      # on the vendor's free tier), so no C2b promotion rides on this switch — there is no payee,
      # no fee and no revenue path anywhere in the module.
      NEWS_ENABLED: "true"
      # Cache TTL is CLAMPED to >= 300000 ms in config (the vendor itself serves max-age=300), so a
      # lower value here buys load, not freshness, and is logged once on boot when clamped. Left
      # unset to take that floor. NEWS_BASE_URL is likewise unset: the default is the vendor.
    cpus: 0.5
    mem_limit: 320m
    healthcheck:
      # /status always returns {"status":"ok"} (server.js:302) regardless of chain health, so matching
      # that string proves only that the process is up — which is all a container healthcheck should
      # assert. Real chain health is checked by probe.sh, which reads the per-chain rpc values.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/status | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s     # /status does an uncached per-chain RPC fan-out on first call
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- OZ Relayer engine, INSIDE the gateway's namespace ----
  engine:
    container_name: fairwins-gateway-engine
    image: us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/fairwins-relay-engine:multichain-v1.5.0
    restart: unless-stopped
    pull_policy: missing
    network_mode: "service:gateway"
    depends_on:
      redis:
        condition: service_started
    env_file:
      - /run/fairwins/engine.env    # API_KEY, WEBHOOK_SIGNING_KEY, GCP_PRIVATE_KEY — engine ONLY
    environment:
      IN_DOCKER: "true"
      APP_PORT: "8080"
      METRICS_ENABLED: "false"
      LOG_LEVEL: "info"
      REDIS_URL: "redis://localhost:6379"     # correct verbatim — shared namespace
      GCP_PRIVATE_KEY_ID: "4f206bc79b3f42976c9c49a30d485e3b304b750f"
      GCP_CLIENT_EMAIL: "fairwins-relay-engine@chippr-bots-site-wp.iam.gserviceaccount.com"
    volumes:
      # config.json is delivered read-only from the repo checkout on the VM. Its localhost:8788
      # webhook URL is correct here — do NOT template it.
      #
      # ⚠ THE ENGINE HAS ITS OWN `rpc_urls`, and they are NOT this file's RPC_URLS_137. The engine
      # is the WRITE path — it broadcasts every relayed transaction — and it reads that list from
      # config.json, which is a plain file in git. It therefore stays on PUBLIC endpoints: the keyed
      # QuickNode URL carries its token in the path, and putting it here would commit a credential.
      # Its dead polygon.llamarpc.com entry was replaced 2026-08-23 (see the note on RPC_URLS_137
      # above); giving the write path the keyed endpoint needs a templated config rendered at boot
      # from Secret Manager, which is a separate change.
      - /opt/fairwins/repo/services/oz-relayer/deploy/production/config.json:/app/config/config.json:ro
    cpus: 0.35
    mem_limit: 320m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- FinOps exporter (spec 089), INSIDE the gateway's namespace ----
  #
  # READ-ONLY BY CONSTRUCTION: no signer, no write route, no public surface. It binds LOOPBACK ONLY
  # and declares no `ports:` — nginx does not proxy it and it is unreachable from outside this VM
  # (FR-027). Alloy reaches it at localhost:9464 verbatim, because it shares this namespace.
  #
  # Its credentials are vendor READ tokens in their own env file; fetch-secrets.sh refuses to boot if
  # key material ever lands there.
  finops:
    container_name: fairwins-gateway-finops
    # finops-52fdb6e2 — adds the two fixes that the first working image exposed (#1586):
    #   * QuickNode reads `data.credits_used`, the field the API actually returns. The `quicknode`
    #     source was `unreadable` for its whole life behind five guessed field names.
    #   * The boot fan-out is bounded (4 concurrent) and outbound RPC paced (25/s, HALF the 50 req/s
    #     the keyed endpoint shares with the gateway and bundler). On finops-8e9c1730 the unbounded
    #     `Promise.all` took eleven sources `unreadable` with `-32007` for ~2 minutes per restart.
    # Smoked under this file's own --memory 384m: healthz in 2s, still serving after 60s,
    # oom=false restarts=0. A local boot with the deployed config shape hit 0 rate-limit errors.
    #
    # finops-8e9c1730 was the first image that SERVES. The pin before it (spec107-1ac148bf, 2026-09-05)
    # was OOM-killed before app.listen() on every boot: 5,966 restarts, not one scrape, every FinOps
    # panel blank. Verified on the built image itself under this file's own --memory 384m, twice:
    # healthz in 2s, still serving /metrics after a 60s settle window, oom=false restarts=0. The
    # PREVIOUS pin fails that same check at 384m — double the ceiling it actually died at — which is
    # how we know the limit below is headroom and the fix is the x402 log filter.
    #
    # Also carries what spec107-1ac148bf predated: the spec-109 alphaday entry (dead on arrival — it
    # had no flatSubscriptions key and reported a QuickNode credential as its problem), the #1539
    # executor-nonce series, and the newly catalogued pinata + thegraph sources.
    image: us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/fairwins-finops-exporter:finops-52fdb6e2
    restart: unless-stopped
    pull_policy: missing
    network_mode: "service:gateway"
    env_file:
      - /run/fairwins/finops.env   # vendor READ tokens only. MUST NOT contain a signing key.
    environment:
      PORT: "9464"
      FINOPS_BIND_HOST: "127.0.0.1"
      # Gateway usage counters (spec 106/#1447): the gateway-upstream-usage source. Reaches the
      # gateway's compose-internal counters port by service name; unset would read not-configured,
      # which is honest, but this node runs both halves so it is wired on.
      FINOPS_GATEWAY_METRICS_URL: "http://gateway:9091/counters"
      # The build's cohort. Reads never cross the testnet/mainnet boundary (constitution III).
      FINOPS_COHORT_CHAIN_IDS: "63,137"
      RPC_URLS_63: "https://rpc.mordor.etccooperative.org,https://geth-mordor.etc-network.info"
      # Same shape as the gateway above: public failover here, keyed primary from finops.env as
      # RPC_URL_PRIMARY_137. The exporter reads treasury, gas-wallet and paymaster balances, so an
      # endpoint that cannot serve them makes those sources `unreadable` — an honest state, but one
      # a working archive endpoint simply avoids.
      RPC_URLS_137: "https://polygon-bor-rpc.publicnode.com,https://polygon.drpc.org"
      # Contracts it READS. Same addresses the gateway uses; nothing new is trusted.
      PAYMASTER_ADDRESS_137: "0xe14554D14eB5DeC47f7824ebeeDa6C9f3A50d105"
      GAS_WALLET_63: "0xf505d95F62bEE94437C112d3D64ee7Df0Fa973aC"
      GAS_WALLET_137: "0x3BB28b184b8a748dE22aBD076634F85adADA82db"
      # Read from deployments/polygon-chain137-v2.json — the recorded source of truth for addresses.
      # Unset would be HONEST (those sources report `not-configured` rather than a fabricated zero),
      # but all three are deployed, so leaving them unset would hide revenue that exists.
      FEE_ROUTER_ADDRESS: "0xf8161fC26172621E9fbcc6c39500Bb14b0902B35"
      MEMBERSHIP_MANAGER_ADDRESS: "0xEfd1a880c6BfBf38A661A3F5fF6d5ECB296D557a"
      # x402 settlement discovery (spec 096). READ-ONLY: the treasury the rail pays INTO and the
      # token it pays IN. Deliberately the SAME values the gateway service above is given, from the
      # same names — two services disagreeing about where money went is the failure this avoids.
      # The exporter holds no key and settles nothing; it only scans for settlements already made.
      X402_PAY_TO: "0xcf76db7aa9Fb1BFe08E010468F3344bB45830447"
      X402_CHAIN_ID: "137"
      X402_PAYMENT_TOKEN: "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359"
      BUNDLER_EXECUTOR_137: "0x7C6da19ae005D4F13BB8660Ac989c48aCcFE84F6"
      GCP_PROJECT_ID: "chippr-bots-site-wp"
      FINOPS_BILLING_DATASET: "billing_export"
      # GCP writes the DETAILED (resource-level) export to `gcp_billing_export_resource_v1_*`, and
      # the standard one to `gcp_billing_export_v1_*`. This account has the detailed export enabled,
      # so the collector's default prefix matched no table and the source read `unreadable` for 17h
      # with a message that looked like latency. Measured 2026-08-17: the only table present is
      # gcp_billing_export_resource_v1_0166E9_FC2238_00E06F.
      #
      # The detailed schema is a superset — service.description, cost, usage_start_time and
      # export_time all carry the same meaning — so the collector's query is unchanged.
      FINOPS_BILLING_TABLE_PREFIX: "gcp_billing_export_resource_v1_"
      # Cloudflare and QuickNode publish NO dollar figure (spec 089 research R1). These declared plan
      # prices are what the `modelled` cost is computed from, and the dashboard labels it as such.
      # Unset ⇒ usage is still reported, no dollar figure is invented.
      # The zone is on Cloudflare's FREE plan, so 0 here is an ASSERTED zero, not an unset default —
      # which is the distinction the collector draws: unset reports `not-configured`, 0 reports a
      # modelled cost of nothing.
      CLOUDFLARE_ZONE_ID: "a548702815279eab4646275cde3be103"
      FINOPS_CLOUDFLARE_PLAN_USD: "0"
      # Same asserted zero, for the plan this whole system runs on (FR-029 — a FinOps system that
      # hides its own cost is not credible). Operator-confirmed free tier, 2026-09-11; unset was
      # reporting `not-configured`, which is honest but indistinguishable on a panel from the
      # QuickNode source beside it that is genuinely broken.
      FINOPS_GRAFANA_PLAN_USD: "0"
      # The Graph: an asserted zero, and the evidence is IN THE REPO rather than on a billing page.
      # Every configured subgraphUrl in frontend/src/config/networks.js points at
      # api.studio.thegraph.com — Subgraph Studio, the free development tier, which consumes no GRT.
      # This is therefore a property of the endpoint we call, not a guess about an account.
      #
      # It stops being true the moment a subgraphUrl becomes gateway.thegraph.com: query fees are
      # then paid in GRT from a billing balance on ARBITRUM ONE (L1 GRT does not pay them), and the
      # free allowance FAILS rather than billing over. `check:finops` C6 fails on exactly that
      # combination, so this line cannot quietly outlive the tier it describes.
      FINOPS_THEGRAPH_PLAN_USD: "0"
      # V8 SIZES ITS HEAP FROM HOST RAM, NOT THE CGROUP. Without this, Node looks at the VM's
      # ~2 GB and targets a heap far above the container ceiling, so it feels no pressure to
      # collect and simply grows until the kernel kills it — which is precisely what happened
      # here: OOM-killed at exactly 192 MiB, 5,966 times, always before `app.listen()`, so the
      # exporter never served a scrape and every FinOps panel read "no data". Keep this BELOW
      # mem_limit: the ceiling has to leave room for the non-heap side (sockets, buffers, the
      # BigQuery client) or V8 stays under its own limit while the cgroup still kills the process.
      NODE_OPTIONS: "--max-old-space-size=256"
    cpus: 0.2
    # 384m, not 192m. Measured: module load alone (ethers + @google-cloud/bigquery + express) is
    # ~87 MB before a single collector runs, and the fan-out across ~25 sources sits on top of that.
    # 192m left no headroom at all, so any transient allocation was fatal rather than collected.
    # Host has ~880 MB free with the rest of the stack running, so this is affordable headroom, not
    # a licence to grow: NODE_OPTIONS above keeps V8 collecting well under it.
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9464/healthz | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The listener now comes up BEFORE the first collection rather than behind it, so this is a
      # real liveness window again instead of a race against a fan-out across every vendor.
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- Grafana Alloy (spec 089), INSIDE the gateway's namespace ----
  #
  # Scrapes localhost:9464 and remote_writes to Grafana Cloud. It exists so the exporter never has to
  # own snappy-protobuf remote_write, a WAL, or retry semantics (research R10).
  alloy:
    container_name: fairwins-gateway-alloy
    image: grafana/alloy:v1.10.2
    restart: unless-stopped
    pull_policy: missing
    network_mode: "service:gateway"
    depends_on:
      finops:
        condition: service_started
    env_file:
      - /run/fairwins/alloy.env    # GRAFANA_CLOUD_PROM_TOKEN only.
    environment:
      # Endpoint and username are ACCOUNT IDENTIFIERS, not secrets; only the token is fetched.
      GRAFANA_CLOUD_PROM_URL: "https://prometheus-prod-66-prod-us-east-3.grafana.net/api/prom/push"
      GRAFANA_CLOUD_PROM_USER: "3500268"
      FINOPS_COHORT: "mainnet"
      FW_NODE_NAME: "fairwins-gateway"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      # NOT exposed: the agent's own UI would be a second HTTP surface on this VM for no benefit.
      - --server.http.listen-addr=127.0.0.1:12345
    volumes:
      - /opt/fairwins/repo/infra/grafana/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    cpus: 0.15
    mem_limit: 192m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- ephemeral redis, INSIDE the gateway's namespace ----
  redis:
    container_name: fairwins-gateway-redis
    image: redis:7-alpine
    restart: unless-stopped
    pull_policy: missing
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_started
    # Ephemeral by design, matching Cloud Run: no persistence, nothing to restore. The engine's
    # in-flight state is reconstructible from chain.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # NOTE: do NOT add `read_only: true` + `cap_drop: ALL` here. redis:7-alpine's entrypoint runs
    # `find . \! -user redis -exec chown redis '{}' +` as root; with CAP_CHOWN dropped that returns
    # EPERM and the container never starts. This was a reproduced boot-fatal defect in an earlier draft.
    cpus: 0.15
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

# ---- named volumes ----
#
# Alloy's write-ahead log. Persisted, unlike redis above, because the WAL is what carries samples
# across a Grafana Cloud outage or a stack restart — an ephemeral WAL would silently drop exactly the
# data collected during the incident somebody later wants to look at.
volumes:
  alloy-data:
