# infra/vm/bundler/docker-compose.yml — the alto ERC-4337 bundler + origin-lock nginx on GCE.
#
# NETWORK MODEL: nginx joins alto's network namespace (`network_mode: "service:alto"`), reproducing
# Cloud Run's sidecar namespace exactly. Consequence you must NOT "fix": the nginx image bakes
# `upstream 127.0.0.1:3000` (services/alto-bundler/nginx/bundler.conf.template) and that is CORRECT
# here. Rewriting it for a bridge network would be a needless image rebuild.
#
# Only the namespace OWNER (alto) may declare `ports:`, and it publishes to LOOPBACK ONLY — the host
# nginx terminates TLS on :443 and proxies to 127.0.0.1:8080. Nothing binds a VPC-reachable interface.
#
# Recreating alto invalidates nginx's namespace. ALWAYS act on the whole project
# (`systemctl restart fairwins-stack@bundler`), never `docker restart` a single container.
#
# Resource limits mirror the right-sized Cloud Run values (PR #1000) so an e2-small cannot be starved
# by a leak in either container. Measured 30d p99 for the whole instance was 0.358 vCPU / 0.261 GiB.
name: fairwins-bundler

services:
  # ---- namespace owner: alto (localhost-only; the host nginx is the only route in) ----
  alto:
    container_name: fairwins-bundler-alto
    image: us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/alto:v1.2.7
    restart: unless-stopped
    pull_policy: missing          # boot must not depend on the registry being reachable
    ports:
      - "127.0.0.1:8080:8080"     # host nginx -> nginx sidecar (which proxies to :3000 in-namespace)
      # Loopback-published so the host nginx's /__probe/health can reach alto DIRECTLY. The probe's
      # own comment says it must bypass the origin lock, but until this line the only host-reachable
      # path was :8080 — the origin-lock sidecar itself — which 403s the headerless probe. Result:
      # the uptime check read 0% for 14 days over a healthy alto. Loopback only; nothing binds a
      # VPC-reachable interface, and every other caller still goes through the sidecar on :8080.
      - "127.0.0.1:3000:3000"
    env_file:
      # ALTO_EXECUTOR_PRIVATE_KEYS + ALTO_UTILITY_PRIVATE_KEY + ALTO_RPC_URL.
      - /run/fairwins/alto.env
    environment:
      ALTO_ENTRYPOINTS: "0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789"   # EntryPoint v0.6
      # ⚠ ALTO_RPC_URL IS DELIBERATELY ABSENT FROM THIS BLOCK. It arrives in alto.env from
      # QUICKNODE_POLYGON_API (fetch-secrets.sh), because the keyed QuickNode URL carries its token
      # in the path and cannot be written into a file in git.
      #
      # docker-compose `environment:` OVERRIDES `env_file:`. Re-adding ALTO_RPC_URL here — even
      # "temporarily", even to the old public value — silently takes the bundler back off the keyed
      # endpoint, and it keeps passing its healthcheck the whole time, because eth_supportedEntryPoints
      # answers fine on an endpoint that cannot serve the archive eth_getLogs the receipt path needs.
      # That is exactly the 2026-07-12 failure: ops mined, confirmations never surfaced.
      #
      # It is fetched as REQUIRED: alto takes one endpoint, has no failover and no default, so an
      # unavailable secret must abort the boot with a diagnosis rather than crash-loop without one.
      #
      # ⚠ RELEASE 1.14.0 TASK 8 generalized "QuickNode primary, publicnode failover" across the
      # frontend (NETWORKS[chainId].rpcFailoverUrl, every EVM mainnet) and the relay gateway
      # (RPC_URL_PRIMARY_<chainId> prepended to a public RPC_URLS_<chainId> list) — alto is the
      # DELIBERATE exception, not an oversight. alto v1.2.7 has no multi-URL / failover config
      # surface at all: ALTO_RPC_URL is a single value, full stop. A "publicnode fallback" here
      # would need either a second alto process behind a proxy (new machinery on the write path,
      # not undertaken for a problem not yet observed — see the rate-limit note below) or an alto
      # version bump, neither of which is a config/docs change. If alto ever gains multi-endpoint
      # support, wire it the same way — keyed primary via Secret Manager, public failover written
      # in the clear here — and update this comment.
      #
      # ⚠ 50 req/s, SHARED. The endpoint's rate limit is per ENDPOINT, not per consumer, and three
      # processes now sit behind it: alto (here), the gateway and the FinOps exporter. alto is both
      # the heaviest — a continuous block-poll plus receipt polling, independent of UserOp volume —
      # and the only one with NOTHING behind it: the other two list public endpoints as failover, so
      # a 429 storm costs them latency and costs alto its whole service.
      #
      # No client-side limiter is added here, deliberately. alto v1.2.7 exposes no request-rate
      # knob, so limiting would mean a proxy in front of it — new machinery, on the write path, to
      # solve a problem not yet observed. The instrument already exists instead: the FinOps exporter
      # reads QuickNode credit usage (collectors/quicknode.js). Watch that series after this change;
      # build a limiter if it shows a ceiling being approached, not before.
      ALTO_SAFE_MODE: "false"
      ALTO_PORT: "3000"
      ALTO_API_VERSION: "v1,v2"
      ALTO_NETWORK_NAME: "polygon"
      # Which chain THIS instance serves. Not an alto setting — ours, and load-bearing:
      # single-alto-gate.sh attributes each running alto to a chain by this value, because the
      # invariant it enforces is "at most one alto per (chain, executor EOA)" and a container NAME
      # is just a label somebody chose. An alto with no FW_CHAIN_ID is REFUSED rather than assumed
      # safe — an instance the gate cannot reason about is the condition it exists to catch.
      FW_CHAIN_ID: "137"
      # MUST stay "true" on Polygon (verified 2026-07-12). With false, alto v1.2.7's filterOps
      # references a simulations contract that isn't deployed and throws a swallowed error BEFORE any
      # broadcast — ops validate but the executor never sends, its nonce freezes, every UserOp times
      # out. Do NOT set false.
      ALTO_DEPLOY_SIMULATIONS_CONTRACT: "true"
      # Polygon public RPCs report a stale ~25-30 gwei priority fee under congestion (real p50 has hit
      # 110-135), so alto underprices bundles. These lift the suggestion so bundles land during spikes.
      ALTO_GAS_PRICE_MULTIPLIERS: "400,500,600"
      # Cuts alto's log volume, which was measured at 1,025 MB/mo — 75% of the entire project's log
      # ingest — at 13 req/day, because the default level pretty-prints raw EVM bytecode one line per
      # token. That verbosity also burns the CPU this VM is sized against.
      ALTO_LOG_LEVEL: "info"
    cpus: 0.85
    mem_limit: 896m
    healthcheck:
      # alto binds its listener only AFTER a successful eth_chainId round trip (measured 8.79s boot),
      # so a TCP check would pass before it can serve. This asserts the real JSON-RPC surface.
      # NOTE: /healthz on the nginx sidecar is a static `return 200` that never touches alto
      # (bundler.conf.template:52-55) — it must never be used as a bundler healthcheck.
      test: ["CMD-SHELL", "wget -qO- --post-data='{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_supportedEntryPoints\",\"params\":[]}' --header='Content-Type: application/json' http://127.0.0.1:3000 | grep -q 0x5FF137D4 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s           # >> the measured 8.79s boot, with headroom for a slow RPC
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ---- origin-lock nginx, INSIDE alto's namespace ----
  nginx:
    container_name: fairwins-bundler-nginx
    image: us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/alto-bundler-nginx:latest
    restart: unless-stopped
    pull_policy: missing
    network_mode: "service:alto"  # shares alto's namespace => `upstream 127.0.0.1:3000` is correct
    depends_on:
      alto:
        condition: service_started
    env_file:
      - /run/fairwins/nginx.env   # ORIGIN_LOCK_SECRET ONLY — never the executor key
    # The image's entrypoint renders the secret into /etc/nginx/conf.d/default.conf via envsubst.
    # On Cloud Run that was an ephemeral container FS; here docker's writable layer is on the boot
    # disk, so we mount the render target on tmpfs to keep it out of persistent storage.
    tmpfs:
      - /etc/nginx/conf.d:rw,mode=0755
    cpus: 0.15
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
