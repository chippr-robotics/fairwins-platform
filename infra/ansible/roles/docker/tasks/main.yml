# Docker engine at a pinned version (spec 087, US3).
---
- name: Install the Docker apt keyring
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Remove the legacy Docker repo entry
  # The nodes were first provisioned by hand with a binary keyring at /etc/apt/keyrings/docker.gpg.
  # This role declares the ASCII one (docker.asc), and apt REFUSES a source listed twice with two
  # different Signed-By values — so the legacy line must go, or the first converge of an adopted
  # node dies at apt update. Removing the line, not just the keyring: an orphaned Signed-By path is
  # the same conflict.
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: absent
  become: true

- name: Remove the legacy Docker keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  become: true

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  become: true

- name: Install Docker at the pinned version
  # PINNED on purpose. An unpinned docker-ce is the most disruptive thing an unattended converge run
  # can change on these nodes — it restarts the engine, and with it every container in the stack.
  ansible.builtin.apt:
    name:
      - "docker-ce={{ fairwins_docker_version }}"
      - "docker-ce-cli={{ fairwins_docker_version }}"
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

- name: Hold the Docker packages
  # Without a hold, an unattended-upgrades run bumps the engine and undoes the pin — silently, and
  # at whatever hour the timer fires.
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
  become: true

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  become: true
