# Shared node configuration (spec 087).
---
fairwins_project: chippr-bots-site-wp
fairwins_region: us-central1
fairwins_repo_url: https://github.com/chippr-robotics/fairwins-platform.git
fairwins_repo_dir: /opt/fairwins/repo
fairwins_root: /opt/fairwins
fairwins_run_dir: /run/fairwins
fairwins_artifact_registry: us-central1-docker.pkg.dev

# Packages are installed at a PRESENT state with explicit versions where it matters. `state: latest`
# is non-idempotent in the way that counts: it reports changed whenever upstream publishes, and can
# upgrade Docker underneath a running bundler. OS patching is a separate, deliberately-invoked play
# (playbooks/harden.yml).
fairwins_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - python3
  - rsync
  - nginx

# Pin the engine. An unpinned docker-ce is the single most disruptive thing an unattended converge
# run can change on these nodes.
#
# This pin tracks what the nodes ALREADY RUN. It drifted up to 29.7.1 out of band while the pin
# still said 27.5.1, which made the pin worse than useless: `apt` refused the converge outright
# (`Packages were downgraded and -y was used without --allow-downgrades`), so site.yml could not
# reach the nginx, secrets, or stack roles on either node. A pin that points BACKWARDS does not
# hold a version — it asks to restart the container engine underneath a running bundler and
# gateway, which is the exact event this pin exists to prevent. Raise it to match the nodes when
# it drifts; never add --allow-downgrades to make a rollback go through unattended.
fairwins_docker_version: "5:29.7.1-1~debian.12~bookworm"

fairwins_ssl_dir: /etc/ssl/fairwins
fairwins_nginx_conf_dir: /etc/nginx/fairwins
