# Dependency updates (spec 075, T092).
#
# Only possible now that there is ONE lockfile — previously four independent lockfiles plus two
# unlocked units meant Dependabot could not see the tree as a whole. There is currently no
# vulnerability gate anywhere in CI while `npm audit` reports findings on every install, so this is
# the first automated pressure on that.
#
# NOTE the interaction with spec 075's exact-pinning rule: @openzeppelin/contracts,
# @openzeppelin/contracts-upgradeable, @chainlink/contracts, @uma/core and
# @safe-global/safe-contracts contribute SOLIDITY SOURCE, so a bump changes compiled bytecode.
# Those PRs must be treated as contract changes: run the byte-diff gate
# (scripts/codegen/bytecode-digest.js) and expect a NEW baseline to be recorded deliberately, not
# incidentally. They are grouped separately so they are never mixed into a routine tooling bump.
version: 2
updates:
  - package-ecosystem: npm
    # Open updates against `staging`, not `main` (spec 076, FR-018).
    #
    # Since `staging` exists the promotion rule is ACTIVE, and it admits only `staging`,
    # `hotfix/*` and generated release records into main — so a dependabot branch targeting main
    # is unmergeable by construction. It would fail the same check on every run and go stale
    # behind main while it waited.
    #
    # A dependency bump is an ordinary change: it reaches production by promotion, having first
    # run on staging. That matters most for the group this repository can least take on faith —
    # a solidity-sources bump alters compiled bytecode, which is exactly the kind of change that
    # should not arrive on main without having run somewhere first.
    target-branch: staging
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bumping any of these changes deployed bytecode. Isolated so the diff is unmistakable.
      solidity-sources:
        patterns:
          - "@openzeppelin/contracts"
          - "@openzeppelin/contracts-upgradeable"
          - "@chainlink/contracts"
          - "@uma/core"
          - "@safe-global/safe-contracts"
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@openzeppelin/*"
          - "@chainlink/*"
          - "@uma/*"
          - "@safe-global/*"
    ignore:
      # Pinned deliberately: hardhat's internal evmVersion default is a build input (spec 075
      # FR-001), so a major bump must be adopted with the byte-diff gate, not auto-merged.
      - dependency-name: hardhat
        update-types: ["version-update:semver-major"]

      # The rest of the hardhat TOOLCHAIN, for the same reason. `hardhat` alone was ignored, but
      # its plugins move in lockstep with it: Dependabot offered hardhat-toolbox ^6->^7,
      # hardhat-ethers ^3->^4 and hardhat-ignition ^0.15->^3.1 in one grouped PR (#1047), which is
      # a Hardhat 3 migration touching every test and deploy script — arriving as a routine
      # "dev-tooling" bump. Ignoring only the root package let the migration in through the side
      # door.
      - dependency-name: "@nomicfoundation/*"
        update-types: ["version-update:semver-major"]

      # These two decide DEPLOYED PROXY BYTECODE, and no gate covers it. `upgrades.deployProxy`
      # (scripts/deploy/lib/upgradeable.js) deploys the ERC1967Proxy artifact BUNDLED INSIDE the
      # plugin — a different compile from anything in artifacts/contracts/**, which is all the
      # byte-diff gate hashes. So a major bump here can silently change the CREATE2 address of a
      # proxy this repo documents as living at a stable address. See #1039 (finding M4) and #1049.
      - dependency-name: "@openzeppelin/hardhat-upgrades"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@openzeppelin/upgrades-core"
        update-types: ["version-update:semver-major"]

      # chai's ceiling is set by a hold we chose, not by chai. hardhat-chai-matchers@2 peers
      # `chai@^4.2.0`, and that plugin is pinned to v2 by the @nomicfoundation/* rule above
      # pending the Hardhat 3 migration (#1053). Dependabot offered chai 6 in the dev-tooling
      # group (#1084) and the install FAILED outright with ERESOLVE — an unsatisfiable
      # combination, not a lockfile artifact. Lift this together with #1053, not before.
      - dependency-name: chai
        update-types: ["version-update:semver-major"]

      # `solc` is the COMPILER, not tooling, and it is exact-pinned for that reason.
      # hardhat.config.js resolves solc/soljson.js and compiles WITH IT whenever FORCE_SOLCJS=true
      # or in Codespaces (see the compiler subtask, ~line 190) — so its version decides deployed
      # bytecode on that path. Dependabot moved the exact pin 0.8.24 -> 0.8.36 inside a "dev-tooling"
      # group (#1084); the byte-diff gate did not catch it because the local run used the native
      # binary, i.e. the fallback that would have changed bytes was simply not exercised. ANY
      # update, not just major.
      - dependency-name: solc

      # HELD AT 5.4.0 BECAUSE OZ 5.5+ CANNOT COMPILE FOR PRE-CANCUN CHAINS.
      #
      # OZ 5.5 spread the Cancun-only `mcopy` opcode from 2 files to 7 — adding utils/Memory.sol,
      # utils/RLP.sol, utils/structs/Accumulators.sol, utils/cryptography/SignatureChecker.sol and,
      # decisively, utils/Arrays.sol (0 -> 9 uses). Arrays.sol is NOT avoidable: EnumerableSet
      # imports it, and this repo imports AccessControlEnumerableUpgradeable and ERC721Enumerable,
      # so it is always in the compile graph. Every contract here compiles with
      # `evmVersion: "paris"` (hardhat.config.js, both compiler entries) so bytecode deploys on
      # pre-Cancun ETC (61) and Mordor (63). Measured on 5.6.1: `DeclarationError: Function "mcopy"
      # not found` at Arrays.sol:402/432/462/492/540/574. Not a warning — the project does not build.
      #
      # This is the same failure that already blocks GovernorUpgradeable on Mordor via Bytes.sol
      # (spec 030 shipped an external-DAO connector because of it). 5.5+ widens it from one
      # governance module to a large fraction of the library.
      #
      # ANY update, not just major: 5.4.0 -> 5.6.1 is a MINOR bump, so a major-only rule would not
      # have caught it. Dependabot has offered it repeatedly (#1103, deferred via #1055).
      #
      # Two further 5.5 removals are waiting behind this whenever it IS lifted, both compile errors:
      #   * `ReentrancyGuardUpgradeable` is deleted (9 contracts inherit it). The replacement is the
      #     plain `ReentrancyGuard`, which is proxy-safe ONLY from 5.5 — it moved to a fixed
      #     StorageSlot at 0x9b779b17…55f00, byte-identical to the slot the upgradeable variant used.
      #     Do NOT perform that swap while pinned at 5.4.0: there the plain guard is still a
      #     sequential `uint256 private _status`, so the swap would inject a storage variable into
      #     every upgradeable contract and corrupt the layout of every deployed proxy.
      #   * `__UUPSUpgradeable_init()` is deleted, and UUPSManaged calls it. Harmless to drop (it was
      #     always a no-op) but it will not compile until removed.
      #
      # Lift ONLY when ETC/Mordor support is deliberately dropped, or OZ makes the mcopy paths
      # conditional on the EVM target. Not before, and not as part of a routine dependency sweep.
      - dependency-name: "@openzeppelin/contracts"
      - dependency-name: "@openzeppelin/contracts-upgradeable"

  - package-ecosystem: github-actions
    # Open updates against `staging`, not `main` (spec 076, FR-018).
    #
    # Since `staging` exists the promotion rule is ACTIVE, and it admits only `staging`,
    # `hotfix/*` and generated release records into main — so a dependabot branch targeting main
    # is unmergeable by construction. It would fail the same check on every run and go stale
    # behind main while it waited.
    #
    # A dependency bump is an ordinary change: it reaches production by promotion, having first
    # run on staging. That matters most for the group this repository can least take on faith —
    # a solidity-sources bump alters compiled bytecode, which is exactly the kind of change that
    # should not arrive on main without having run somewhere first.
    target-branch: staging
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # ── Outside the lockfile (ADR-006, issue #1648) ───────────────────────────────────────────────
  #
  # Base images and compose images had NO upgrade signal: four used floating tags (node:22-alpine,
  # nginx:alpine, redis:7-alpine) that move under you without telling you, and two Node images sat
  # on an EOL line. They are now exact pins, which is what lets Dependabot propose a bump at all.
  #
  # Majors are ignored on purpose: a runtime line change (Node 22→24, redis 7→8, which is also a
  # license change) is a migration decided at the monthly review, not a routine PR. Patches and
  # minors arrive weekly. Images under our own Artifact Registry are first-party: Dependabot has no
  # credential to read them, and their tags are release ids, not versions.
  #
  # What Dependabot still cannot see (images BUILT from an upstream git tag, like OZ Relayer and
  # alto; toolchain lines in workflows; Ansible collections) is watched by version-watch.yml from
  # scripts/deps/version-pins.json, and every image here must also be claimed there (V-04).
  - package-ecosystem: docker
    target-branch: staging
    directories:
      - /
      - /services/relay-gateway
      - /services/finops-exporter
      - /services/mcp-server
      - /services/alto-bundler/nginx
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "us-central1-docker.pkg.dev/*"

  - package-ecosystem: docker-compose
    target-branch: staging
    directories:
      - /infra/vm/gateway
      - /infra/vm/bundler
      - /services/relay-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "us-central1-docker.pkg.dev/*"
      # Not pullable (ghcr 403s every tag); the engine is built from source at a HELD tag. Its
      # version is a decision recorded in version-pins.json (#1648), never a bot bump.
      - dependency-name: "ghcr.io/openzeppelin/openzeppelin-relayer"

  # Providers only. Terraform core is pinned in the three infra workflows and watched by
  # version-watch.yml; the private chippr-tf-modules refs are commit SHAs (G-16) that need a token
  # Dependabot does not hold. A provider bump changes the reviewed plan; apply runs on merge, so
  # read the plan on the PR like any other infra change.
  - package-ecosystem: terraform
    target-branch: staging
    directories:
      - /infra/terraform/environments/prod
      - /infra/terraform/environments/staging
      - /infra/terraform/bootstrap
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      terraform-providers:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*chippr-tf-modules*"
