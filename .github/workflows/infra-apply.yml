# Automatic apply on merge (spec 087, T066-T069, FR-031..FR-035).
#
# ⚠ THIS WORKFLOW MUTATES PRODUCTION WITHOUT A HUMAN IN THE LOOP.
#
# Under automatic apply, review approves DIFFS, not PERMISSIONS. The permission boundary is the real
# control: `fairwins-tf-apply@` is denied the roles needed to destroy the irreplaceable resources or
# to touch another workload, so a merged mistake fails at the API rather than succeeding quietly.
# See specs/087-infrastructure-as-code/contracts/ci-identity.md.
#
# Three properties this workflow must preserve:
#   FR-034  it applies the plan that was REVIEWED, never a freshly computed one
#   FR-035  a failure is loud, and destructive operations are never retried unattended
#   FR-032  no long-lived credential — GCP auth is federated; the Cloudflare token is the one
#           exception, because Cloudflare offers no OIDC federation
name: Infra Apply

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"

permissions:
  contents: read
  id-token: write
  actions: read

env:
  TERRAFORM_VERSION: "1.15.8"

# Queue, never cancel. Two infra PRs merging close together would otherwise race for the state lock,
# with the loser failing after having already passed review. Combined with Terraform's own
# saved-plan staleness check, a race becomes a clean "re-plan required" instead of a partial change.
concurrency:
  group: infra-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply ${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment: production
    # No trust root, no identity to apply as. A merge before bootstrap must not fail the branch;
    # it simply has nothing to apply. Guarded here rather than discovered at the auth step.
    if: vars.WIF_PROVIDER != '' && vars.TF_APPLY_SERVICE_ACCOUNT != ''
    strategy:
      # Sequential on purpose: one environment's failure must not leave another mid-apply.
      max-parallel: 1
      fail-fast: true
      matrix:
        environment: [prod, staging]
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout persists a credential as `http.https://github.com/.extraheader` in the
          # workspace's LOCAL git config. An explicit Authorization header OVERRIDES a URL-embedded
          # one, so every git call made from inside the workspace — the module preflight, and
          # `terraform init` fetching the private modules — silently authenticated as GITHUB_TOKEN,
          # which is scoped to THIS repository alone and therefore 404s on chippr-tf-modules.
          #
          # That is what made a correctly-scoped token look broken: the REST API (which does not read
          # git config) returned 200 for the same repo at the same moment git returned 404.
          #
          # Nothing here pushes, so the persisted credential buys nothing and costs correctness.
          persist-credentials: false
          fetch-depth: 0

      - name: Locate the reviewed plan
        id: locate
        uses: actions/github-script@v9
        with:
          script: |
            // Find the PR this commit merged, then its plan run. If the commit did not arrive via a
            // pull request, there is no reviewed plan and this must not proceed.
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha,
            });
            if (prs.length === 0) {
              core.setFailed(
                'No pull request is associated with this commit. Automatic apply executes a plan ' +
                'that a reviewer saw (FR-034); a direct push to main has no such plan. Open a PR.');
              return;
            }
            const pr = prs[0];
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              head_sha: pr.head.sha, status: 'success',
            });
            const planRun = runs.workflow_runs.find((r) => r.name === 'Infra Plan');
            if (!planRun) {
              core.setFailed(
                `No successful Infra Plan run found for PR #${pr.number} head ${pr.head.sha}. ` +
                'Re-run the plan and merge again.');
              return;
            }
            core.setOutput('run_id', planRun.id);
            core.setOutput('pr_number', pr.number);
            core.setOutput('head_sha', pr.head.sha);

      - name: Download the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: infra/terraform/environments/${{ matrix.environment }}
          run-id: ${{ steps.locate.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # FR-034. Terraform already refuses to apply a saved plan against a MOVED STATE ("Saved plan is
      # stale"). What it cannot tell is whether the merged CONFIGURATION is the configuration that
      # was planned — squash merges, rebases, and a second infra PR landing first all change the
      # tree without touching state. Comparing the tree digest closes that gap.
      #
      # The correct outcome on mismatch is a hard stop requiring a re-plan. Computing a fresh plan
      # here and applying it is precisely what FR-034 forbids.
      - name: Verify the plan matches the merged tree
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          prov="infra/terraform/environments/${{ matrix.environment }}/plan-provenance.txt"
          planned_digest="$(grep '^infra_tree_digest=' "$prov" | cut -d= -f2)"
          merged_digest="$(git rev-parse HEAD:infra/terraform)"

          if [ "$planned_digest" != "$merged_digest" ]; then
            echo "::error::The reviewed plan does not match the merged configuration."
            echo "  planned against infra/terraform tree: $planned_digest"
            echo "  merged infra/terraform tree:          $merged_digest"
            echo ""
            echo "The infra tree changed between the plan and the merge — most often because another"
            echo "infra PR landed first, or because the merge rewrote the commit. Applying now would"
            echo "execute a plan nobody reviewed (FR-034)."
            echo ""
            echo "Fix: re-run the plan on a fresh PR (an empty commit is enough) and merge that."
            exit 1
          fi
          echo "Plan provenance verified: $merged_digest"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.TF_APPLY_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # `terraform init` must fetch modules from the PRIVATE chippr-tf-modules repository. The
      # default GITHUB_TOKEN is scoped to this repository only and cannot read it, so a token with
      # Contents:read on that repo is rewritten into git's config here.
      #
      # A missing or wrong token surfaces as `repository not found` on the module source, NOT as a
      # permission error — GitHub returns 404 rather than 403 for a private repo the caller cannot
      # see. Read that message as authentication before you go looking for a wrong path.
      - name: Allow Terraform to fetch private modules
        env:
          # Through `env:`, not interpolated straight into the script. Interpolating a secret into a
          # `run:` body splices its raw bytes into the shell source, so a value containing a newline
          # breaks the command apart — which is exactly how this first failed, with git reporting
          # `URL rejected: Malformed input to a URL function`.
          TF_MODULES_TOKEN: ${{ secrets.TF_MODULES_TOKEN }}
        run: |
          set -euo pipefail
          # Trim stray whitespace. A secret pasted with a trailing newline is invisible in the UI and
          # produces a URL git cannot parse.
          token="$(printf '%s' "${TF_MODULES_TOKEN}" | tr -d '[:space:]')"
          if [ -z "${token}" ]; then
            echo "::error::TF_MODULES_TOKEN is empty. terraform init cannot fetch the private modules."
            exit 1
          fi
          git config --global url."https://x-access-token:${token}@github.com/".insteadOf "https://github.com/"

          # Preflight the credential against the modules repo. Without this, a bad token surfaces
          # three steps later as a terraform module-download failure, where the real message is
          # buried under `Could not download module`. The three failure modes below are genuinely
          # different problems with genuinely different fixes, and git reports them distinctly.
          if ! err="$(git ls-remote https://github.com/chippr-robotics/chippr-tf-modules.git HEAD 2>&1)"; then
            echo "::error::TF_MODULES_TOKEN cannot read chippr-robotics/chippr-tf-modules."
            case "$err" in
              *"Invalid username or token"*|*"Authentication failed"*)
                echo "::error::The token was REJECTED. If it is a fine-grained PAT, it must list"
                echo "::error::chippr-tf-modules explicitly under 'Repository access' — a token"
                echo "::error::scoped to other repositories is rejected here even though it is valid."
                echo "::error::If it is a classic PAT, it needs the 'repo' scope AND SSO authorisation"
                echo "::error::for the chippr-robotics organisation."
                ;;
              *"not found"*|*"does not exist"*)
                echo "::error::The repository was NOT FOUND, which for a private repo usually means"
                echo "::error::the token cannot see it rather than that it is missing — GitHub"
                echo "::error::returns 404 rather than 403 to a caller without access."
                ;;
              *)
                echo "::error::${err}"
                ;;
            esac
            exit 1
          fi
          echo "Module repository reachable."

      - name: Init
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false

      # NO RETRY, EVER (FR-035). Terraform writes state incrementally, so a mid-apply failure leaves
      # some resources created. An automatic retry would re-attempt destructive operations against a
      # half-applied estate. The correct response is a human re-planning and inspecting — see
      # docs/runbooks/infrastructure-operations.md.
      - name: Apply the reviewed plan
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform apply -input=false -lock-timeout=10m tfplan

      - name: Record the apply
        if: always()
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: |
          {
            echo "### Apply: ${{ matrix.environment }} — ${{ job.status }}"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- reviewed in: #${{ steps.locate.outputs.pr_number }} (head \`${{ steps.locate.outputs.head_sha }}\`)"
            echo "- plan run: ${{ steps.locate.outputs.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failed apply
        if: failure()
        run: |
          echo "::error::Apply FAILED for ${{ matrix.environment }}. State may be partially applied."
          echo "::error::Do NOT re-run this job. Follow the partial-apply procedure in"
          echo "::error::docs/runbooks/infrastructure-operations.md: re-plan, inspect, then decide."
