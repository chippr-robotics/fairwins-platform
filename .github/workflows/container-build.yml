name: Container Images Build

# Spec 075 fallout. The workspace conversion broke BOTH shipped images and CI reported green,
# because no workflow has ever built either one:
#
#   · the SPA image ran `npm ci` inside frontend/ after this repo dropped to a single root
#     lockfile — `npm ci` cannot install without a lockfile, so the image failed outright;
#   · the relay-gateway image BUILT SUCCESSFULLY and then died at boot on
#     ERR_MODULE_NOT_FOUND, because `npm ci` writes a workspace symlink whether or not its
#     target directory exists, and packages/intent-types was never copied in.
#
# CI missed both because its jobs run `npm ci --workspace <name>` against a FULL CHECKOUT, where
# packages/ is present. The Docker build context is a different, narrower world, and it was the
# only world nothing tested. This workflow tests that world.
#
# No `branches:` filter — a PR into a feature branch needs this as much as one into main, and
# scoping by base branch is the defect fixed in #1033. `paths:` is the scoping tool.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'services/**/Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/package.json'
      - 'services/relay-gateway/package.json'
      - 'services/mcp-server/**'
      - 'packages/**'
      - 'tools/miniapp-build/**'
  push:
    branches:
      - main
      # spec 076 FR-022/FR-023: staging builds the same images production will, so a container
      # regression must surface on the integration branch rather than at promotion.
      - staging
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'services/**/Dockerfile'
      - 'services/mcp-server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spa-image:
    name: SPA image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `--target build` stops before nginx: the build stage is where the workspace install and
      # the Vite build happen, which is the whole risk surface. Building the runtime stage too
      # would only copy an already-produced dist/.
      - name: Build the frontend image build stage
        run: docker build -f Dockerfile --target build -t fairwins-spa:ci .

      # A build that exits 0 having produced nothing is the failure mode this repo keeps hitting,
      # so assert the artefact rather than the exit code.
      - name: Assert the bundle actually exists
        run: |
          set -o pipefail
          docker run --rm --entrypoint sh fairwins-spa:ci -c '
            test -s dist/index.html || { echo "::error::dist/index.html missing or empty"; exit 1; }
            n=$(ls dist/assets 2>/dev/null | wc -l)
            [ "$n" -gt 0 ] || { echo "::error::dist/assets is empty"; exit 1; }
            echo "bundle OK: $n asset(s)"
          '

  gateway-image:
    name: Relay gateway image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the relay-gateway image
        run: docker build -f services/relay-gateway/Dockerfile -t fairwins-relay-gateway:ci .

      # Building is NOT enough — this image built green for the entire life of the workspace
      # branch and exited instantly at runtime.
      #
      # An import probe is not enough EITHER. Checking only that @fairwins/intent-types resolves
      # would leave this job's name ("builds and boots") broader than what it asserts, and would
      # ship green through any other boot regression: loadConfig() throwing, a missing
      # deployments/ record failing the FR-025 startup check, or any runtime ESM error outside
      # that one import. Reported in review on #1034. So: start the real entrypoint and require
      # the server to actually answer.
      #
      # Written WITHOUT `exit 0` and without `|| true`, because CiGates rejects both — correctly:
      # a bare `exit 0` is exactly how a step forces success, and the guard cannot distinguish my
      # "early return on success" from that. Restructuring costs nothing and keeps the guard
      # strict; an exemption would have spent the guard's credibility on my own convenience.
      - name: Boot the container and require /healthz to answer
        run: |
          set -euo pipefail
          docker run -d --name gw -p 8788:8788 fairwins-relay-gateway:ci

          healthy=0
          for i in $(seq 1 30); do
            if ! docker ps --filter name=gw --filter status=running -q | grep -q .; then
              echo "::error::the container exited during startup"
              break
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:8788/healthz >/dev/null 2>&1; then
              healthy=1
              echo "healthz answered after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$healthy" != 1 ]; then
            echo "::error::the gateway never served /healthz — see the container logs below"
          fi
          docker logs gw
          # Last command, so its status IS the step's. No `exit`, nothing to swallow.
          test "$healthy" = 1

      # `xargs -r` runs nothing when there is no match, so this exits 0 on its own rather than
      # needing `|| true` — including when the boot step failed before the container existed.
      - name: Stop the container
        if: always()
        run: docker ps -aq --filter "name=^gw$" | xargs -r docker rm -f

  finops-exporter-image:
    name: FinOps exporter image builds, boots and stays up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the finops-exporter image
        run: docker build -f services/finops-exporter/Dockerfile -t fairwins-finops-exporter:ci .

      # THIS JOB DID NOT EXIST, AND THAT IS WHY THE EXPORTER WAS DEAD FOR ITS ENTIRE LIFE.
      #
      # The image built green every time; `npm run test:finops` passed every time. Neither can see
      # a process that starts, allocates without bound, and is killed by the cgroup before it
      # listens — which is what the deployed container did 5,966 consecutive times, serving not one
      # scrape while every FinOps dashboard read "no data".
      #
      # Two assertions, and the second is the one with teeth:
      #
      #   1. it ANSWERS /healthz  — the gateway job's property, and enough to catch a boot crash.
      #   2. it is STILL ANSWERING after a settle window, under a memory limit at the deployed
      #      value — because the failure mode here is not "fails to start", it is "starts, looks
      #      fine, and dies 45 seconds in". A boot probe that returns the moment the port opens
      #      passes straight through that.
      #
      # --memory matches infra/vm/gateway/docker-compose.yml. Keep them in step: a CI run with
      # more headroom than production is a CI run that cannot fail the way production does.
      #
      # VERIFIED AGAINST BOTH SIDES before this job was committed, which is the bar this repo sets
      # for a gate (`test:finops-gate`, `check:ci-gating` — each has its own must-fail fixture):
      #
      #   staging @ffeba8d4 (pre-fix)  -> "container exited during startup", oom=true, survived=0
      #   this branch (post-fix)       -> healthz in 2s, still serving after 60s, oom=false
      #
      # Note the pre-fix image died at 384m — DOUBLE the production ceiling it was actually killed
      # at. That is the useful part: it confirms the limit was never the fix, and it means this job
      # would have failed on the commit that introduced the wide filter, not merely on the one that
      # tightened the container.
      - name: Boot under the production memory limit and require it to still be alive after
        run: |
          set -euo pipefail
          docker run -d --name finops \
            --memory 384m --memory-swap 384m \
            -e PORT=9464 \
            -e FINOPS_BIND_HOST=0.0.0.0 \
            -e NODE_OPTIONS=--max-old-space-size=256 \
            -e FINOPS_COHORT_CHAIN_IDS=137 \
            -p 9464:9464 \
            fairwins-finops-exporter:ci

          healthy=0
          for i in $(seq 1 30); do
            if ! docker ps --filter name=finops --filter status=running -q | grep -q .; then
              echo "::error::the container exited during startup"
              break
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:9464/healthz >/dev/null 2>&1; then
              healthy=1
              echo "healthz answered after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$healthy" != 1 ]; then
            echo "::error::the exporter never served /healthz"
            docker logs finops
          fi

          # The settle window. The deployed container reached its ceiling in ~45s, so a probe that
          # stops at first response is exactly the probe that reported it healthy.
          survived=0
          if [ "$healthy" = 1 ]; then
            sleep 60
            if docker ps --filter name=finops --filter status=running -q | grep -q . \
               && curl -fsS --max-time 5 http://127.0.0.1:9464/metrics | grep -q fairwins_finops_source_configured; then
              survived=1
              echo "still serving metrics after the settle window"
            else
              echo "::error::the exporter stopped serving within 60s of boot — check for an OOM kill"
              docker inspect finops --format 'oom={{.State.OOMKilled}} exit={{.State.ExitCode}} restarts={{.RestartCount}}'
              docker logs finops
            fi
          fi

          # Last command, so its status IS the step's. No `exit`, nothing to swallow.
          test "$survived" = 1

      - name: Stop the container
        if: always()
        run: docker ps -aq --filter "name=^finops$" | xargs -r docker rm -f

  mcp-image:
    name: MCP server image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Note the build context: `services/mcp-server`, NOT the repo root. That service has no
      # dependencies, no workspace package and no install stage, so there is nothing outside its own
      # directory to copy — and a root context would quietly re-admit the failure mode this job
      # exists to catch elsewhere. If this build ever starts needing the root, the Dockerfile has
      # gained a dependency and needs the spec-075 treatment the other two images have.
      - name: Build the mcp-server image
        run: docker build -f services/mcp-server/Dockerfile -t fairwins-mcp-server:ci services/mcp-server

      # Building is not enough here either. The server is deliberately written to boot and speak MCP
      # even when it is misconfigured — so the interesting assertion is that it SERVES with a dummy
      # gateway URL that resolves to nothing: a start-up that depended on the gateway being reachable
      # would strand every member behind an outage they have no way to diagnose.
      - name: Boot the container and require /healthz to answer
        run: |
          set -euo pipefail
          docker run -d --name mcp -p 8790:8790 \
            -e FAIRWINS_API_URL=https://gateway.invalid \
            fairwins-mcp-server:ci

          healthy=0
          for i in $(seq 1 30); do
            if ! docker ps --filter name=mcp --filter status=running -q | grep -q .; then
              echo "::error::the container exited during startup"
              break
            fi
            if curl -fsS --max-time 2 http://127.0.0.1:8790/healthz >/dev/null 2>&1; then
              healthy=1
              echo "healthz answered after ${i}s"
              break
            fi
            sleep 1
          done

          if [ "$healthy" != 1 ]; then
            echo "::error::the MCP server never served /healthz — see the container logs below"
          fi
          docker logs mcp
          # Last command, so its status IS the step's. No `exit`, nothing to swallow.
          test "$healthy" = 1

      # The protocol is the product: an image that answers /healthz but not `initialize` is broken in
      # the only way that matters to a client, and would ship green on the liveness probe alone.
      - name: Require the MCP handshake over POST /mcp
        run: |
          set -euo pipefail
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          answer=$(curl -fsS --max-time 5 -H 'content-type: application/json' -d "$body" http://127.0.0.1:8790/mcp)
          echo "$answer"
          echo "$answer" | grep -q '"protocolVersion":"2025-06-18"'
          echo "$answer" | grep -q '"name":"fairwins-mcp"'

      - name: Stop the container
        if: always()
        run: docker ps -aq --filter "name=^mcp$" | xargs -r docker rm -f
