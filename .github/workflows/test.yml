name: Test Pipeline

on:
  # pull_request/push triggers deliberately REMOVED (spec 075, FR-009).
  # ci-manager.yml invokes this workflow via workflow_call; declaring event triggers here
  # as well made it run TWICE per commit, which is why ci-manager's change detection only
  # ever ADDED work instead of reducing it.
  workflow_dispatch:
  workflow_call:
    inputs:
      run_e2e:
        description: >-
          Whether this change can affect the running app, and therefore whether the Cypress tiers
          need to run. Computed by ci-manager's `app` path filter, which is a NEGATIVE list — see
          the comment on the Cypress jobs below before changing anything about this.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  # Gate (spec 072, FR-008): every tenants/<id>/manifest.json must be valid —
  # structure, domain uniqueness, fee caps, cohort separation, dedicated-mode
  # record presence. Must fail the pipeline loudly (Constitution IV). The
  # validator is dependency-free, so no npm ci is needed.
  tenant-manifests:
    name: Tenant Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate tenant manifests
        run: node scripts/tenants/validate-tenant-manifest.js

  # The release tooling decides what ships and under what number. It had a test suite and no
  # workflow ran it, so it was a suite in the same sense a fire alarm with no battery is an alarm:
  # `scripts/release/__tests__` was green locally while the train on `main` released its own
  # CHANGELOG commits three times (v1.5.5 -> v1.5.6 -> v1.5.7, no product change in any of them).
  # Dependency-free — node:test and git only, so no npm ci.
  release-tooling:
    name: Release Tooling Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # version.js reads tags and commit ranges; a shallow clone makes it answer a different
          # question rather than fail, which is the failure mode its own comments warn about.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run release tooling tests
        run: npm run test:release

      # The Pinata pinning client that replaced `@pinata/sdk`. Stubs `fetch`, so it needs no
      # credentials and no network — which is why it belongs in this dependency-free job.
      - name: Run market-template tooling tests
        run: npm run test:market-templates

      # The E2E deploy-order gate (issue #1298). It only runs in the full/torture tier, where a
      # broken gate would be invisible until the next time someone inserts a deploy — so its own
      # suite runs here, in the tier every push hits. Dependency-free: node:test plus two files
      # read off disk, no chain, no npm ci.
      - name: Run E2E address-gate tests
        run: npm run test:e2e-addresses

      # The bytecode-digest freshness gate (issue #1090). Dependency-free: node:test plus a
      # throwaway fixture tree under os.tmpdir(), no compile and no chain.
      - name: Run build-marker tests
        run: npm run test:build-marker

  # Gate (spec 075, FR-003/FR-015): version skew across manifests and undeclared (phantom)
  # imports. Both invariants were fixed by hand once and had nothing preventing recurrence, which
  # is precisely the failure mode spec 075 exists to remove. Dependency-free, so no npm ci.
  dependency-hygiene:
    name: Dependency Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # check:native-versions resolves the current release from git tags
          # (version.js --current); a shallow, tagless checkout would read
          # "none" and fail every run.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check dependency hygiene
        run: npm run check:deps

      # Spec 102: the native shells' version and identity fields are sync-only
      # (sync-native-config.js writes them from the tenant manifest + the one
      # version source); a hand edit fails here with the file named. The tenant
      # `native` block rules are proven by must-fail fixtures in test:tenants.
      # Both are dependency-free, matching this job's no-install design.
      - name: Check native config sync (spec 102)
        run: npm run check:native-versions

      - name: Tenant manifest gate tests
        run: npm run test:tenants

  # Gate (issue #1460): the spec namespace is shared, and four numbers on `main` are claimed twice
  # (017, 041, 050, 102) because nothing checked. `create-new-feature.sh` computes max+1, which is
  # correct exactly once per merge — two agents who ask before either has merged both get the same
  # answer and both are right. The convention cannot fix that; merging the reservation PR is what
  # claims a number, and this job is what makes the claim binding.
  #
  # Dependency-free (directory names plus one file per spec), so no npm ci — same reasoning as the
  # jobs above. Must fail loudly; do NOT add continue-on-error (Constitution IV).
  # NOTE: the job now also guards the E2E shard bypass and the closing-keyword parser, but its
  # display NAME stays `Spec Registry` on purpose — the check name is what branch protection
  # matches on, and renaming a required check makes the requirement permanently unsatisfiable
  # rather than merely renamed.
  spec-registry:
    name: Spec Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Each rule is driven against a tree that must be REJECTED. Without these the gate could
      # enforce nothing and still print "clean" on every green run, which is exactly how the
      # namespace drifted unobserved for four collisions.
      - name: Test the spec registry gate's own rules
        run: npm run test:specs

      - name: Check the spec registry
        run: npm run check:specs

      # Gate (issue #1460): the E2E shard bypass. The Cypress tiers skip for a change that cannot
      # reach the running app, which is safe ONLY because ci-manager's `app` filter is a negative
      # list — anything unrecognised runs the suite. Inverting it to an allowlist is a one-line,
      # tidier-looking edit that makes every unlisted path skip; since a skipped job satisfies a
      # required check, such a change merges green having tested nothing. Fixtures first, for the
      # same reason as above.
      - name: Test the CI-gating guard's own rules
        run: npm run test:ci

      - name: Check the E2E bypass is still safe
        run: npm run check:ci-gating

      # A VITE_ build arg a Cloud Build file sets but the Dockerfile never declares is DROPPED by
      # docker with only a warning — green pipeline, built image, absent feature. Its first run
      # found VITE_STAGING_BANNER in exactly that state, so the marker saying staging sends REAL
      # mainnet transactions had never rendered. Same job because it is the same shape: no npm ci,
      # dependency-free, its own must-fail fixtures.
      - name: Check every build arg reaches the build
        run: npm run check:build-args

      # The parser that decides which issues a `staging` merge closes. Same job because it is the
      # same shape of thing: dependency-free, must-refuse fixtures, no npm ci.
      - name: Test the closing-keyword parser
        run: node --test "scripts/ci/__tests__/parse-closing-keywords.test.js"

      # Gate (issue #1521): dependency vulnerabilities were the last class still on the honour
      # system. dependabot.yml said in its own header that no vulnerability gate existed anywhere in
      # CI; none did, and 45 alerts (1 critical, 9 high) accumulated with every required check green.
      #
      # This is the OFFLINE half — policy schema, acceptance expiry, and the wiring of
      # dependency-alerts.yml. It needs no token and no network, so it runs on every PR including
      # forks and Dependabot's own, which is exactly where the live half cannot run. Expiry is
      # enforced here, so a time-boxed acceptance rotting past its date fails a pull request rather
      # than waiting for the nightly job.
      - name: Test the dependency alert gate's own rules
        run: npm run test:dep-alerts

      - name: Check the dependency alert policy
        run: npm run check:dep-alerts

  # Gate (spec 089, FR-019…FR-023): a revenue or cost source that reaches production without a
  # dashboard entry is money moving that nobody is watching. The brief stated updating the dashboard
  # as a MUST; every comparable invariant in this repo that survived was made a gate, because a prose
  # rule with no enforcement is the one rule that gets broken.
  #
  # Dependency-free (the catalogue has zero runtime deps), so no npm ci — same reasoning as the job
  # above. Must fail loudly; do NOT add continue-on-error (Constitution IV).
  finops-coverage:
    name: FinOps Dashboard Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # A gate that silently passes everything is worse than no gate. These drive each C2b rule
      # against a fixture that MUST be rejected — including the catalogue with the x402 entry
      # removed, which is the state this gate was green in before the rule existed.
      - name: Test the coverage gate's own rules
        run: npm run test:finops-gate

      - name: Check FinOps source coverage
        run: npm run check:finops

  smart-contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resilient solc fetch + compile (cache the pinned compiler, retry stalled
      # downloads). Replaces a bare `npm run compile`, which hangs indefinitely
      # when binaries.soliditylang.org stalls.
      - name: Compile contracts
        uses: ./.github/actions/setup-hardhat-solc

      # The compile above runs inside the composite action, not `npm run compile`, so npm's
      # postcompile hook (issue #1090's freshness marker) does not fire here. Write the marker
      # explicitly: this step running at all means the action's compile exited 0, which is the
      # exact condition the marker asserts. Without it the byte gate below fails closed on
      # "no build marker" — correctly, but about the wrong thing.
      - name: Record build marker for the byte gate
        run: node scripts/codegen/write-build-marker.js

      # Gate (spec 025, FR-010/SC-005): block a storage-incompatible / upgrade-unsafe implementation BEFORE
      # it can ship. Must fail the pipeline loudly — do NOT add continue-on-error (Constitution IV).
      - name: Check upgradeable storage layout
        run: npm run check:storage-layout

      # Gate (spec 075, FR-032): the committed ABIs must match the compiled contracts. The proxies
      # are upgraded IN PLACE at stable addresses, so a stale ABI desynchronises the app and the
      # subgraph from the chain with no address change to notice. Must fail loudly (constitution IV).
      - name: Check generated ABIs are current
        run: npm run check:abis

      # Gate (spec 075, FR-005). plan.md describes this feature as "gated on a byte-for-byte
      # bytecode diff that BLOCKS the change on any difference" — but the script was referenced
      # nowhere except a comment in dependabot.yml, so it blocked nothing and was a tool someone
      # had to remember to run. This is the step that makes the sentence true.
      #
      # It is the only automated defence against the incident that motivated the pin: a floating
      # @chainlink/contracts (1.3.0 -> 1.5.0) silently changed ChainlinkFunctionsOracleAdapter's
      # deployed bytecode with every other gate green, because CompilerTargets only checks the
      # SHAPE of a version range, not the bytes that come out. Runs directly after Compile so the
      # artifacts it hashes are this run's.
      - name: Bytecode is byte-identical to the recorded baseline
        run: node scripts/codegen/bytecode-digest.js --compare specs/075-monorepo-workspaces/baseline-bytecode.json

      # spec 075 FR-041: exercise the task graph with caching DISABLED. Turborepo does not sandbox,
      # so an undeclared input yields a wrong cache hit rather than an error; the cache is not
      # trusted in CI until the graph has been observed to reproduce this pipeline's outcomes.
      # Lives in THIS job because //#check:abis depends on //#compile — the dependency-hygiene job
      # deliberately installs nothing.
      - name: Root gates via the task graph (cache disabled)
        run: npx turbo run check:abis tenants:validate --force

      - name: Run tests
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Summarize test results
        if: always()
        run: |
          echo "### Smart Contract Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if grep -q "passing" test-output.txt; then
            PASSING=$(grep -oP '\d+ passing' test-output.txt | head -1)
            PENDING=$(grep -oP '\d+ pending' test-output.txt | head -1 || echo "0 pending")
            FAILING=$(grep -oP '\d+ failing' test-output.txt | head -1 || echo "")
            DURATION=$(grep -oP '\(\d+[ms]+\)' test-output.txt | tail -1 || echo "")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passing | $PASSING |" >> $GITHUB_STEP_SUMMARY
            [ -n "$PENDING" ] && echo "| Pending | $PENDING |" >> $GITHUB_STEP_SUMMARY
            [ -n "$FAILING" ] && echo "| Failing | $FAILING |" >> $GITHUB_STEP_SUMMARY
            [ -n "$DURATION" ] && echo "| Duration | $DURATION |" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Could not parse test output" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Contract coverage is a first-class gate (spec 046): it MUST fail the pipeline
      # loudly (Constitution IV) — no continue-on-error. The run emits
      # coverage/coverage-summary.json (istanbul json-summary via .solcover.js).
      - name: Generate coverage report
        run: npm run test:coverage

      - name: Summarize coverage
        if: always()
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "### Contract Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Extract top-level coverage percentages
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('Statements: ' + c.statements.pct + '%');
              console.log('Branches:   ' + c.branches.pct + '%');
              console.log('Functions:  ' + c.functions.pct + '%');
              console.log('Lines:      ' + c.lines.pct + '%');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      # Blocking gate: fail the PR if any security-critical contract falls below its
      # tier in coverage-threshold-policy.json (spec 046, FR-011). Report-only
      # contracts never fail the gate.
      - name: Enforce coverage thresholds (security-critical gate)
        run: node scripts/coverage/check-thresholds.js --summary coverage/coverage-summary.json --policy coverage-threshold-policy.json --scope gated

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: contracts-coverage-report
          path: coverage/
          # 7, not 30. The repo is private, so artifacts draw on the account storage
          # quota (public repos get it free) — 30-day retention at this push rate is
          # what exhausted it and failed every job on upload. Coverage numbers land in
          # the step summary above; the HTML is only read same-day, if ever.
          retention-days: 7

  # Gate (spec 075, FR-019/FR-020/B2). Mini-app output bytes are keccak-committed on-chain in
  # MiniAppRegistry, and the chain of custody is:
  #   npm hoisting -> module resolution -> host shim text -> entry.js -> manifest hash -> on-chain
  # A change to installation layout can therefore invalidate an immutable, curated, on-chain record
  # with no error raised anywhere. This gate existed as a script but appeared in NO workflow — it
  # was a manual checklist item, for the one guarantee in this repo that cannot be re-checked after
  # the fact.
  miniapp-bytes:
    name: Mini-app Output Bytes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      # `--since` stamped BEFORE the build, and `&&` so a failed build can never reach the
      # compare. Both matter: the compare used to accept any dist/ younger than 10 minutes, so a
      # build that FAILED left the previous successful output in place and the gate printed
      # "output bytes unchanged" — the exact false pass its own source comment describes, which
      # happened once already when rollup's native binary went missing during this conversion.
      - name: Build mini-apps and compare output bytes
        run: |
          set -euo pipefail
          STAMP=$(($(date +%s) * 1000))
          # Explicit `&&`, and explicit `-e`. The comment above claims the compare cannot be
          # reached by a failed build, so the code must say that rather than lean on the runner's
          # default `bash -e {0}` — a `shell:` override, or someone copying this block elsewhere,
          # would silently turn the claim false. Relying on implicit shell behaviour for a gate's
          # blocking property is how the tee'd steps in this repo lost their exit codes.
          #
          # KEEP THIS COMPOUND LAST. `set -e` deliberately does NOT fire on a failing left-hand
          # side of `&&`, so the build's failure reaches the step only as the compound's own exit
          # status. Verified: with a trailing command after it, a failed build yields step exit 0.
          npm run build:miniapps && node scripts/miniapps/record-build-digests.js \
            --compare specs/075-monorepo-workspaces/baseline-miniapp-builds.json \
            --since "$STAMP"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      # IMPORTANT: Linting errors must fail the build to prevent code quality regressions.
      # Do not add 'continue-on-error: true' to this step as it would hide ESLint failures.
      - name: Run linter
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.txt

      - name: Summarize lint results
        if: always()
        run: |
          echo "### Frontend Lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          WARNINGS=$(grep -c "warning" lint-output.txt 2>/dev/null || echo "0")
          ERRORS=$(grep -c "error" lint-output.txt 2>/dev/null || echo "0")
          if [ "$ERRORS" = "0" ] && [ "$WARNINGS" = "0" ]; then
            echo "✅ No lint issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Type | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  # Relay-gateway service tests (specs 035/036/050 + the spec-055 OpenSea proxy).
  # Gating like every other test job — no continue-on-error (Constitution IV).
  relay-gateway-tests:
    name: Relay Gateway Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/relay-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install gateway dependencies
        run: npm ci --workspace fairwins-relay-gateway --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run tests
        run: npm test

  # FinOps exporter tests (spec 089). The honesty suite is the load-bearing one: it asserts that a
  # source which could not be read never renders as a zero, in any state, under any failure mode.
  # Gating like every other test job — no continue-on-error (Constitution IV).
  finops-exporter-tests:
    name: FinOps Exporter Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/finops-exporter

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install exporter dependencies
        run: npm ci --workspace fairwins-finops-exporter --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run tests
        run: npm test

  # MCP server tests (specs 095/096). This suite was written and then never run by CI: the only job
  # touching this service built the image and curled /healthz, which is a liveness check, not a test.
  # The load-bearing cases here are the transport's — where it binds, whose Origin it serves, and
  # that `--http` refuses to boot into a shared identity. Every one of those is a decision a passing
  # container smoke test cannot see.
  #
  # NO INSTALL STEP, and that is the point rather than an omission: this service has zero
  # dependencies and is deliberately NOT a workspace member (spec 075), so there is nothing to
  # install and `node --test` runs against node built-ins alone. Adding an install here would be the
  # first step towards giving it the lockfile coupling it exists without.
  # Gating like every other test job — no continue-on-error (Constitution IV).
  mcp-server-tests:
    name: MCP Server Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/mcp-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests
        run: node --test test/*.test.js

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run tests
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm test -- --run --reporter=verbose 2>&1 | tee test-output.txt
        env:
          # Parity with frontend-testing.yml, which runs the IDENTICAL suite (spec 075, T027).
          # Without the heap bump the full suite OOMs; TZ is pinned because several suites
          # hard-code UTC datetime strings and would pass or fail on the runner's locale.
          NODE_OPTIONS: --max-old-space-size=4096
          TZ: UTC

      - name: Summarize test results
        if: always()
        run: |
          echo "### Frontend Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse Vitest output
          FILES=$(grep -oP '\d+ passed' test-output.txt | tail -1 || echo "")
          TESTS_LINE=$(grep "Tests" test-output.txt | tail -1 || echo "")
          DURATION_LINE=$(grep "Duration" test-output.txt | tail -1 || echo "")

          if [ -n "$TESTS_LINE" ]; then
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| $TESTS_LINE |" | sed 's/^/| Tests | /' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo "| Duration | $DURATION_LINE |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Coverage report generation can fail due to environment issues without indicating
      # actual test failures. We allow this to fail gracefully while still uploading
      # whatever coverage data was generated.
      - name: Generate coverage report
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm run test:coverage -- --run 2>&1 | tee coverage-output.txt
        continue-on-error: true

      - name: Summarize coverage
        if: always()
        run: |
          echo "### Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage/coverage-summary.json" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('Statements: ' + c.statements.pct + '%');
              console.log('Branches:   ' + c.branches.pct + '%');
              console.log('Functions:  ' + c.functions.pct + '%');
              console.log('Lines:      ' + c.lines.pct + '%');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            # Fall back to parsing text output
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A5 "^-\|^All files\|^%" coverage-output.txt | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-test-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Build frontend
        run: npm run build

      - name: Summarize build output
        if: always()
        run: |
          echo "### Frontend Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            TOTAL_SIZE=$(du -sh dist | cut -f1)
            JS_SIZE=$(find dist -name "*.js" -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1 || echo "n/a")
            CSS_SIZE=$(find dist -name "*.css" -exec du -ch {} + 2>/dev/null | tail -1 | cut -f1 || echo "n/a")
            FILE_COUNT=$(find dist -type f | wc -l)
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total size | $TOTAL_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| JS bundle | $JS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| CSS bundle | $CSS_SIZE |" >> $GITHUB_STEP_SUMMARY
            echo "| Files | $FILE_COUNT |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed — no dist directory" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # No dist/ upload. Nothing downloads it — the gate is `npm run build` exiting 0,
      # and the step summary above already reports bundle sizes and file count. Uploading
      # 2.5 MB of unread bytes on every push is pure quota burn on a private repo.

  cypress-fast-e2e:
    # SHARD BYPASS (issue #1460). `run_e2e` is false only when the diff touches nothing that can
    # reach the running app — docs, specs, agent config, markdown. A docs-only pull request was
    # spending 12 fast legs + 4 on-chain shards + the passkey full stack on bytes that cannot
    # change a single pixel.
    #
    # READ THIS BEFORE WIDENING IT. A skipped job SATISFIES a required status check, which is the
    # exact hole spec 075 documented: work that runs zero jobs merges green. The only thing that
    # makes this safe is that ci-manager's `app` filter is a NEGATIVE list — it starts at `'**'`
    # and subtracts known-inert paths — so a directory nobody has thought about matches `**`, sets
    # `app` true, and RUNS the suite. Converting it to a positive allowlist would invert that:
    # every unlisted path would silently skip. `npm run check:ci-gating` fails on that inversion,
    # and on this `if:` being dropped.
    #
    # Default is `true`, so `workflow_dispatch` and any future caller that forgets the input runs
    # everything.
    if: inputs.run_e2e
    # Spec 094: one leg per viewport profile. Responsive behaviour needs no chain, so this is where
    # it belongs — admission rule 1 forbids spending on-chain-tier wall clock proving a control is
    # reachable at 390px. `desktop` is 1280×720, exactly what every existing spec was written
    # against, so that leg is a no-op change and any diff in it is a real regression.
    #
    # SHARDED SIX WAYS PER PROFILE (#1249). This tier had become the merge gate's critical path at
    # 34:29 of Cypress on the desktop leg, against 09:53–17:09 for the on-chain shards that compile
    # contracts, boot a chain and send real transactions. The cause was structural, not the work:
    # that tier was sharded four ways and this one was a single leg. Six is the first count where
    # BOTH profiles fit the policy's < 6 min budget (predicted 349s desktop / 315s phone); seven and
    # eight buy little, because the floor is the longest single spec (34-member-surfaces, 192s).
    #
    # Runner minutes are ~neutral: 2 legs × ~37 min ≈ 74, against 12 legs × (≈50s setup + ≈6 min)
    # ≈ 82. This tier installs only frontend deps — no contract compile, no chain — so the per-job
    # overhead sharding adds is small next to the wall clock it removes.
    name: Cypress Fast E2E (${{ matrix.viewport }} ${{ matrix.shard }})
    runs-on: ubuntu-latest

    strategy:
      # Every leg always runs: a phone-only or one-shard failure is information, not a reason to
      # stop measuring the rest.
      fail-fast: false
      matrix:
        viewport: [desktop, phone]
        shard: [0, 1, 2, 3, 4, 5]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      # RESTORED BEFORE THE INSTALL, deliberately — same reasoning as the two tiers below, which
      # have carried this pair for a while. This tier did NOT, and it is the one that runs TWELVE
      # jobs (6 shards x 2 viewport profiles), so it was both the most exposed to a cold or evicted
      # cache and the only one unprotected from it. Observed on PR #1607: `npm ci` reported 1431
      # packages added, `cypress run` then said "the Cypress binary is missing", and the job failed
      # having executed no spec at all — a red check that says nothing about the code under test.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci --workspace frontend --workspace tools/miniapp-build --workspace @fairwins/miniapp-clearpath --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      # Belt and braces, copied verbatim in intent from the full tier: `npm ci` normally installs
      # the binary via cypress's postinstall, but a partial cache or a skipped script leaves the
      # package without it, and `cypress run` then fails deep into the job rather than here.
      - name: Ensure Cypress binary
        run: npx cypress install
        working-directory: .

      # Spec 030 pillar A — fast/46-clearpath-unavailable.cy.js serves the REAL ClearPath package
      # bytes (the loader verifies them), so this leg needs the package built. It needs no chain:
      # the registry read is stubbed and the gateway fetches are intercepted. Measured ~0.3s.
      # One `npm ci` invocation above, not a second one — a second `npm ci` would wipe the first.
      - name: Build the ClearPath mini-app package
        run: npm run build --workspace @fairwins/miniapp-clearpath
        working-directory: .

      # Constitution IV: this step MUST fail the pipeline on error. Do NOT reintroduce
      # `continue-on-error` here (spec 075, FR-007/FR-008).
      #
      # `set -o pipefail` is load-bearing: the command is piped into `tee`, so without it the
      # step's exit status is tee's (always 0) and cypress's failure is discarded exactly as
      # `continue-on-error` used to discard it.
      # Only the NO-CHAIN tier is doubled. The account-native (passkey) tier rides this job for its
      # runner, not because it is a viewport question: it drives the WebAuthn harness, its budget is
      # a single sub-5-minute run, and running it twice would contradict the policy this feature
      # just wrote down. It goes in the desktop leg — the width every one of its specs was authored
      # against.
      # The spec list for this leg. Computed into an env var rather than inlined in the run command
      # so the job log shows exactly which specs the leg claimed — a shard that silently ran nothing
      # would otherwise report the same green as one that ran six specs. (Same reasoning, and the
      # same empty-list guard, as the on-chain tier's shard selection.)
      - name: Select this leg's specs
        id: specs
        working-directory: .
        run: |
          SPECS=$(node scripts/e2e/split-fast-tier.js \
            --profile ${{ matrix.viewport }} --shards 6 --index ${{ matrix.shard }} --csv)
          if [ -z "$SPECS" ]; then
            echo "::error::Fast-tier ${{ matrix.viewport }} shard ${{ matrix.shard }} resolved to an empty spec list — refusing to report a pass for running nothing."
            exit 1
          fi
          echo "${{ matrix.viewport }} shard ${{ matrix.shard }} specs: $SPECS"
          echo "specs=$SPECS" >> $GITHUB_OUTPUT

      - name: Run fast E2E tests
        env:
          # Read by cypress/support/viewports.js and applied from a global beforeEach, so a spec
          # written tomorrow is covered at both widths without its author doing anything.
          CYPRESS_VIEWPORT_PROFILE: ${{ matrix.viewport }}
          # Account-native tier (#1271). Without this the WebAuthn specs skip themselves, and 16
          # of the tier's 17 tests were permanently pending while the coverage matrix recorded
          # them as covered. It needs no bundler — the ceremonies and the local address derivation
          # run without a chain, which is why the author gated them separately from
          # PASSKEY_FULL_STACK. Desktop only: the passkey specs ride that leg (see the spec
          # selection above), so setting it on the phone leg would claim something it never ran.
          CYPRESS_PASSKEY_ENABLED: ${{ matrix.viewport == 'desktop' && '1' || '' }}
        run: |
          set -o pipefail
          npx start-server-and-test dev:fast http://localhost:5173 'cypress run --spec "${{ steps.specs.outputs.specs }}" --reporter json --reporter-options "output=cypress-results.json"' 2>&1 | tee cypress-output.txt

      - name: Summarize E2E results
        if: always()
        run: |
          echo "### Cypress Fast E2E — ${{ matrix.viewport }} viewport, shard ${{ matrix.shard }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse the RUN-TOTAL row of Cypress's own summary table. The previous version preferred
          # cypress-results.json, which Cypress never writes (see `Check E2E results`), and its
          # fallback grepped the first `N passing` line — i.e. spec #1's tally reported as if it
          # were the whole run.
          #
          # The totals row is the last line matching "All specs passed!" or "N of M failed", with
          # columns: <label> <duration> <tests> <passing> <failing> <pending> <skipped>.
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-output.txt > cypress-plain.txt
          TOTALS=$(grep -E "(All specs passed!|[0-9]+ of [0-9]+ failed)" cypress-plain.txt | tail -1)
          if [ -n "$TOTALS" ]; then
            # Strip box-drawing characters, then take the trailing numeric columns.
            NUMS=$(echo "$TOTALS" | tr -d '│┌┐└┘─' | sed 's/[✔✖]//g' | grep -oE '[0-9]+|-' | tail -5 | tr '\n' ' ')
            set -- $NUMS
            # Cypress prints "-" for a zero column, so normalise it rather than rendering "-".
            z () { [ "${1:-}" = "-" ] || [ -z "${1:-}" ] && echo 0 || echo "$1"; }
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ${1:-?} |" >> $GITHUB_STEP_SUMMARY
            echo "| Passing | $(z "${2:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Failing | $(z "${3:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Pending | $(z "${4:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`$(echo "$TOTALS" | tr -d '│' | xargs)\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Cypress produced no run-total row — see the job log." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Belt-and-braces assertion on the machine-readable results (spec 075, FR-008).
      #
      # This replaces `grep -q "failing" cypress-output.txt`, which could never match: the run uses
      # `--reporter json`, so that file holds JSON, and mocha's JSON reporter emits `"failures": N`
      # — never the word "failing". Combined with the `continue-on-error` above, the gate reported
      # success on every run regardless of how many tests failed.
      #
      # A missing results file is also a failure: a crashed or never-started run must not pass.
      - name: Check E2E results
        if: always()
        run: |
          # This gate used to require cypress-results.json. Cypress NEVER WRITES THAT FILE:
          # `--reporter json --reporter-options "output=..."` emits the JSON to stdout and the
          # option is ignored (verified directly — a passing single-spec run exits 0 and leaves no
          # file). So spec 075 swapped an always-green gate for an always-RED one: this step could
          # not pass even with every test green, which is the same defect wearing the other face.
          # There is also no aggregate to write — the json reporter emits one object PER SPEC.
          #
          # The authoritative pass/fail is cypress's EXIT CODE, which is non-zero iff tests failed
          # and which `set -o pipefail` on the run step now preserves. What that exit code cannot
          # tell us is whether the run died before executing anything, so that is what this checks.
          #
          # EVERY MATCH BELOW RUNS ON THE DE-COLOURED COPY. Cypress writes
          # `(<esc>[4m<esc>[1mRun Finished<esc>[22m<esc>[24m)`, so the literal "(Run Finished)"
          # does not occur in the raw file, and the totals row's ✖ is wrapped in codes too.
          # Grepping the raw output for either is the same mistake as the original gate grepping
          # "failing" against a reporter that only ever emits "failures" — a check that cannot fire.
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-output.txt > cypress-plain.txt

          if ! grep -qE "Run Finished" cypress-plain.txt; then
            echo "::error::Cypress never reached 'Run Finished' — the run died before completing. Failing rather than assuming success."
            exit 1
          fi

          # Cross-check the reported totals. Belt and braces: the run step already failed the job
          # on a non-zero exit, but a summary row claiming failures must never coexist with a
          # green step.
          if grep -qE "[0-9]+ of [0-9]+ failed" cypress-plain.txt; then
            echo "::error::Cypress reported failing specs."
            grep -E "[0-9]+ of [0-9]+ failed" cypress-plain.txt
            exit 1
          fi

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          # Sharded (#1249): the name must carry the shard or six legs of the same profile
          # collide on one artifact name and the upload fails.
          name: cypress-fast-screenshots-${{ matrix.viewport }}-${{ matrix.shard }}
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v7
        # failure() not always(): a video of a PASSING run is never watched, and these are the
        # largest artifacts in the pipeline. Uploading them on every push is what pushed the
        # artifact API into rate-limiting.
        if: failure()
        with:
          name: cypress-fast-videos-${{ matrix.viewport }}-${{ matrix.shard }}
          path: frontend/cypress/videos
          retention-days: 7

      - name: Upload Cypress JSON results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-fast-results-${{ matrix.viewport }}-${{ matrix.shard }}
          path: frontend/cypress-output.txt
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # Cypress Full E2E — the on-chain money paths (#1028).
  #
  # This tier is the one that proves the PRODUCT works: create, accept, decline, cancel, resolve,
  # claim, refund, freeze, pause, expire — every one driven through the real UI against a real
  # WagerRegistry on a local chain. `fast/**` deliberately never touches a chain, so until this
  # job existed the merge gate could not tell a working money path from a broken one.
  #
  # Why it needs its own job rather than more specs in cypress-fast-e2e: this tier requires a
  # hardhat node, a full contract deploy and a seed, none of which the fast tier wants to pay for.
  # Keeping them separate also keeps the failure legible — a red here means the money path broke,
  # not that a button moved.
  cypress-full-e2e:
    # SHARD BYPASS (issue #1460). `run_e2e` is false only when the diff touches nothing that can
    # reach the running app — docs, specs, agent config, markdown. A docs-only pull request was
    # spending 12 fast legs + 4 on-chain shards + the passkey full stack on bytes that cannot
    # change a single pixel.
    #
    # READ THIS BEFORE WIDENING IT. A skipped job SATISFIES a required status check, which is the
    # exact hole spec 075 documented: work that runs zero jobs merges green. The only thing that
    # makes this safe is that ci-manager's `app` filter is a NEGATIVE list — it starts at `'**'`
    # and subtracts known-inert paths — so a directory nobody has thought about matches `**`, sets
    # `app` true, and RUNS the suite. Converting it to a positive allowlist would invert that:
    # every unlisted path would silently skip. `npm run check:ci-gating` fails on that inversion,
    # and on this `if:` being dropped.
    #
    # Default is `true`, so `workflow_dispatch` and any future caller that forgets the input runs
    # everything.
    if: inputs.run_e2e
    # SHARDED, 4 legs, one private chain each (spec 094). Legal only because per-spec chain
    # isolation (#1222) made specs order-independent — before that, run order decided which specs
    # passed and splitting the list would have changed results, not just wall clock.
    #
    # The split is longest-processing-time-first over measured per-spec seconds
    # (frontend/cypress/coverage/full-tier-weights.json). Balancing spec COUNT would leave the
    # critical path barely shorter than the ~30-minute serial run, because the specs are nowhere
    # near equal.
    #
    # 4, not 8: each leg pays a fixed few minutes of install, compile, node start, deploy and seed.
    # Past 4 that setup dominates and runner minutes grow faster than wall clock falls.
    #
    # MEASURED on the first sharded run (Actions 32204349960): legs of 6:37 / 7:51 / 6:29 / 6:09
    # against a serial total of 1621s (~27 min). That is why this stays on every push — at ~7
    # minutes a leg it is no longer the thing a branch waits on, which was the concern when the
    # only number available was the serial one.
    name: Cypress Full E2E (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the others: which OTHER money paths also broke is the
      # first thing anyone reading a red run needs.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    # Per-LEG bound, down from the serial job's 60. The cap exists to catch a hang, not to
    # accommodate one — but it has to sit above what a healthy leg actually costs, and the tier
    # has roughly tripled since 25 was chosen against ~7-minute legs. MEASURED 2026-09-03
    # (Actions run 33814290875): legs of 23:53 / 23:18 / 21:05 of job time, of which ~7:30 is
    # checkout, install, compile and deploy before Cypress starts; the fourth leg was killed at
    # the 25-minute cap mid-spec, having failed nothing. A cancelled leg is a leg whose specs
    # went unreported, so a cap a healthy run brushes is not a safety margin — it is a coin flip
    # on the merge gate.
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      # RESTORED BEFORE THE INSTALL, deliberately. Cypress's postinstall checks
      # ~/.cache/Cypress and skips the ~250 MB download when the binary is already there — so a
      # cache step placed after `npm ci` would restore the cache having just paid the cost it
      # exists to avoid.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      # ROOT install, unlike cypress-fast-e2e's frontend-only one: this tier drives hardhat
      # (node, compile, deploy, seed), which lives at the root and is deliberately not a
      # workspace member.
      - name: Install dependencies
        run: npm ci

      # Belt and braces: `npm ci` normally installs the binary via cypress's postinstall, but a
      # partial cache or a skipped script leaves the package without it, and `cypress run` then
      # fails deep into the job rather than here.
      - name: Ensure Cypress binary
        run: npx cypress install

      - name: Compile contracts
        run: npx hardhat compile

      # The chain must be ANSWERING before the deploy runs, not merely spawned. Polling
      # eth_chainId is the only honest readiness signal — a fixed sleep either wastes time or
      # races, and a race here surfaces as a confusing deploy error rather than "no chain".
      #
      # Deliberately NO bare `exit 0` on the success path. test/config/CiGates.test.js rejects one
      # in any merge-gating step, and it is right to: `exit 0` is the mechanism that lets a step
      # report success it did not earn, and a reader cannot tell an early return from a swallowed
      # failure by looking. Recording readiness in a variable and failing on its absence says the
      # same thing without the pattern — and falls through to failure by default.
      # AMOY-SHAPED, deliberately (spec 071 collision): membership reads and purchase settlement
      # are pinned to membershipChainId() — Amoy on a testnet cohort — and that constant is
      # deliberately not runtime-configurable. A 1337 node therefore cannot host the membership
      # money path at all (the purchase button is hard-disabled off the membership home). The
      # node impersonates Amoy instead: local deploys are deterministic by deployer+nonce
      # (chain-id-independent), so addresses match the committed hardhat set, and the app maps
      # 80002 to that set through a DEV-only seam (VITE_E2E_AMOY_LOCAL, dead code in any
      # production bundle).
      - name: Start local chain
        run: |
          # HARDHAT_HARDFORK=prague: Amoy has no EIP-7825 per-tx gas cap; see hardhat.config.js.
          HARDHAT_HARDFORK=prague HARDHAT_LOCAL_CHAIN_ID=80002 npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          ready=""
          for i in $(seq 1 60); do
            if curl -s -X POST http://127.0.0.1:8545 \
                 -H 'content-type: application/json' \
                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                 | grep -q result; then
              ready="$i"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Local chain never answered eth_chainId — see the log below."
            cat /tmp/hardhat-node.log
            exit 1
          fi
          echo "chain up after ${ready}s"

      # deploy + sync-frontend-contracts + seed. The seed is what makes the specs' preconditions
      # true (two funded accounts, membership granted, registry approved), so a failure here must
      # stop the job rather than let 95 specs fail one by one for the same reason.
      # setup:e2e, not setup:local: same deploy + seed, minus the frontend-contracts sync — the
      # 80002 mapping comes from the seam above, and the sync would try to rewrite the REAL Amoy
      # address table with local values.
      - name: Deploy and seed the local chain
        run: npm run setup:e2e

      # Constitution IV: this step MUST fail the pipeline on error — no `continue-on-error`.
      # `set -o pipefail` is load-bearing for the same reason it is in cypress-fast-e2e: the
      # command is piped into `tee`, so without it the step's status is tee's (always 0).
      # `dev:e2e`, NOT `dev`. Encryption is mandatory on the create path, and
      # PINATA_CONFIG.USE_PROXY is false outside a production build — so with no VITE_PINATA_JWT
      # getPinataAuthHeaders() THROWS and every wager creation dies before it reaches
      # WagerRegistry. `dev:e2e` supplies a DUMMY value whose only job is to let the request be
      # issued, so the specs' cy.interceptIpfs() can stub it; no bytes leave the runner. It cannot
      # leak into a real bundle — pinataSecretGuard() refuses any production build with it set.
      # The spec list for this leg. Computed once into an env var rather than inline in the run
      # command so the job log shows exactly which specs the leg claimed — a shard that silently
      # ran nothing would otherwise report the same green as one that ran four specs.
      - name: Select this shard's specs
        id: shard
        run: |
          SPECS=$(node scripts/e2e/split-full-tier.js --shards 4 --index ${{ matrix.shard }} --csv)
          if [ -z "$SPECS" ]; then
            echo "::error::Shard ${{ matrix.shard }} resolved to an empty spec list — refusing to report a pass for running nothing."
            exit 1
          fi
          echo "shard ${{ matrix.shard }} specs: $SPECS"
          echo "specs=$SPECS" >> $GITHUB_OUTPUT

      - name: Run full E2E tests
        working-directory: frontend
        run: |
          set -o pipefail
          CYPRESS_NETWORK_ID=80002 npx start-server-and-test dev:e2e http://localhost:5173 \
            'cypress run --spec "${{ steps.shard.outputs.specs }}"' 2>&1 | tee cypress-full-output.txt

      - name: Summarize E2E results
        if: always()
        working-directory: frontend
        run: |
          echo "### Cypress Full E2E — shard ${{ matrix.shard }} (on-chain money paths)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-full-output.txt > cypress-full-plain.txt
          TOTALS=$(grep -E "(All specs passed!|[0-9]+ of [0-9]+ failed)" cypress-full-plain.txt | tail -1)
          if [ -n "$TOTALS" ]; then
            NUMS=$(echo "$TOTALS" | tr -d '│┌┐└┘─' | sed 's/[✔✖]//g' | grep -oE '[0-9]+|-' | tail -5 | tr '\n' ' ')
            set -- $NUMS
            z () { [ "${1:-}" = "-" ] || [ -z "${1:-}" ] && echo 0 || echo "$1"; }
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Tests | ${1:-?} |" >> $GITHUB_STEP_SUMMARY
            echo "| Passing | $(z "${2:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Failing | $(z "${3:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "| Pending | $(z "${4:-}") |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`$(echo "$TOTALS" | tr -d '│' | xargs)\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Cypress produced no run-total row — see the job log." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Same two-part gate as the fast tier, and for the same reasons documented there: the run
      # step's exit code is authoritative for pass/fail, but it cannot tell us the run never
      # started. Both matches run on the DE-COLOURED copy — cypress wraps "Run Finished" and the
      # totals row in escape codes, so grepping the raw file is a check that cannot fire.
      - name: Check E2E results
        if: always()
        working-directory: frontend
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-full-output.txt > cypress-full-plain.txt

          if ! grep -qE "Run Finished" cypress-full-plain.txt; then
            echo "::error::Cypress never reached 'Run Finished' — the run died before completing. Failing rather than assuming success."
            exit 1
          fi

          if grep -qE "[0-9]+ of [0-9]+ failed" cypress-full-plain.txt; then
            echo "::error::Cypress reported failing specs in the full (on-chain) tier."
            grep -E "[0-9]+ of [0-9]+ failed" cypress-full-plain.txt
            exit 1
          fi

      - name: Upload chain log
        uses: actions/upload-artifact@v7
        # The chain log is how you tell a reverted transaction from a UI failure, and it is
        # only interesting when something broke.
        if: failure()
        with:
          name: cypress-full-chain-log-${{ matrix.shard }}
          path: /tmp/hardhat-node.log
          retention-days: 7

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-full-screenshots-${{ matrix.shard }}
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-full-videos-${{ matrix.shard }}
          path: frontend/cypress/videos
          retention-days: 7

      - name: Upload Cypress output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-full-results-${{ matrix.shard }}
          path: frontend/cypress-full-output.txt
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────────────────────
  # Cypress Passkey Full Stack — the ERC-4337 tier (specs 041 + 050, issue #1400 §B).
  #
  # The three flows here (`passkey.controllers`, `passkey.recover-account`,
  # `paymaster.sponsored-userop`) were recorded ABSENT for one reason: they need a bundler, and
  # nothing in CI had one. Their specs were gated on `PASSKEY_FULL_STACK`, which nothing ever set,
  # so they reported as pending forever while the matrix showed the flows as covered (#1271). This
  # job is that missing stack — a real EntryPoint v0.6, a real alto bundler, the real verifying
  # paymaster and the real relay gateway signing sponsorships — because there is no honest way to
  # prove "FairWins paid the gas" without something that could have failed to pay it.
  #
  # WHY A SEPARATE JOB, and not more specs in cypress-full-e2e: the SPA resolves the bundler and
  # sponsor-paymaster URLs at BUILD time (`networks.js#passkeyConfig`), so this tier needs a
  # DIFFERENT dev-server build from the one the full tier runs. `paymaster-disclosure.cy.js` on the
  # fast tier asserts the opposite build — that with no paymaster configured nothing claims to be
  # sponsored — and both claims are true of their own deployment. That is also why the spec list
  # below is explicit rather than `passkey/**`: running the disclosure spec against a build that
  # DOES configure a paymaster would fail it for being right.
  #
  # Not sharded: three specs, one chain, one bundler. Sharding would pay four bootstraps to save
  # nothing.
  cypress-passkey-full-stack:
    # SHARD BYPASS (issue #1460). `run_e2e` is false only when the diff touches nothing that can
    # reach the running app — docs, specs, agent config, markdown. A docs-only pull request was
    # spending 12 fast legs + 4 on-chain shards + the passkey full stack on bytes that cannot
    # change a single pixel.
    #
    # READ THIS BEFORE WIDENING IT. A skipped job SATISFIES a required status check, which is the
    # exact hole spec 075 documented: work that runs zero jobs merges green. The only thing that
    # makes this safe is that ci-manager's `app` filter is a NEGATIVE list — it starts at `'**'`
    # and subtracts known-inert paths — so a directory nobody has thought about matches `**`, sets
    # `app` true, and RUNS the suite. Converting it to a positive allowlist would invert that:
    # every unlisted path would silently skip. `npm run check:ci-gating` fails on that inversion,
    # and on this `if:` being dropped.
    #
    # Default is `true`, so `workflow_dispatch` and any future caller that forgets the input runs
    # everything.
    if: inputs.run_e2e
    name: Cypress Passkey Full Stack (bundler + paymaster)
    runs-on: ubuntu-latest
    # Generous, because a real UserOperation round trip (estimate → sponsor → bundle → mine →
    # receipt) is seconds, not milliseconds, and there are several per spec. Still a cap: it exists
    # to catch a hang, not to accommodate one.
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      # Restored BEFORE the install, for the reason documented on the full tier: cypress's
      # postinstall skips the ~250 MB download when the binary is already in ~/.cache/Cypress.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Ensure Cypress binary
        run: npx cypress install

      - name: Compile contracts
        run: npx hardhat compile

      # AMOY-SHAPED for the same spec-071 reason the full tier documents: membership and the E2E
      # address seam are pinned to 80002, and `VITE_E2E_AMOY_LOCAL` maps that chain id onto the
      # local deployment. Readiness is polled on eth_chainId, never slept on.
      - name: Start local chain
        run: |
          HARDHAT_LOCAL_CHAIN_ID=80002 npx hardhat node > /tmp/hardhat-node.log 2>&1 &
          ready=""
          for i in $(seq 1 60); do
            if curl -s -X POST http://127.0.0.1:8545 \
                 -H 'content-type: application/json' \
                 --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
                 | grep -q result; then
              ready="$i"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Local chain never answered eth_chainId — see the log below."
            cat /tmp/hardhat-node.log
            exit 1
          fi
          echo "chain up after ${ready}s"

      - name: Deploy and seed the local chain
        run: npm run setup:e2e

      # The 4337 prerequisites AND the account stack at its canonical addresses. The current
      # compile does not reproduce the live factory's CREATE2 address (the first run proved it —
      # FR-023 refused), so the bootstrap installs the current runtime AT the canonical addresses
      # with hardhat_setCode and records them; see the script header for why that is the honest
      # shape. The verifying paymaster then deploys through its SHIPPED script unmodified.
      - name: Bootstrap the ERC-4337 prerequisites and the account stack
        run: npx hardhat run scripts/e2e/passkey-stack/deploy-passkey-stack.js --network localhost

      # PM_SIGNER_PRIVATE_KEY is HARDHAT'S PUBLISHED TEST ACCOUNT #9 — printed by `npx hardhat node`
      # on every start, worthless on every real network, and deliberately NOT a secret: a workflow
      # that needed a credential to run its tests would be one nobody could run on a fork. Production
      # signs with Cloud KMS (PM_SIGNER_KMS_KEY) and this variable is unset there. The paymaster
      # contract is deployed with the SAME key's address as its verifying signer, which is what makes
      # the gateway's signature verify on chain — derived here rather than written down twice.
      - name: Deploy the verifying paymaster and fund its deposit
        env:
          PM_SIGNER_PRIVATE_KEY: '0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6'
        run: |
          SIGNER=$(node -e "const {Wallet}=require('ethers');console.log(new Wallet(process.env.PM_SIGNER_PRIVATE_KEY).address)")
          echo "sponsorship signer: $SIGNER"
          # 5 native into the EntryPoint deposit: enough for every op these specs send, and small
          # enough that a runaway would still exhaust it rather than look infinite.
          PM_VERIFYING_SIGNER="$SIGNER" PM_INITIAL_DEPOSIT=5 \
            npx hardhat run scripts/deploy/deploy-verifying-paymaster.js --network localhost

      # Publishes the addresses to later steps AND copies the local deployment record into a
      # directory of its own. The gateway's loadDeployment takes the FIRST *-chain80002-v2.json it
      # finds, and the repo holds the real Amoy record under that pattern too — pointed at
      # `deployments/` it would boot on mainnet-testnet addresses, screen against a SanctionsGuard
      # with no code here, fail closed, and refuse every sponsorship while looking healthy.
      - name: Publish stack addresses
        run: node scripts/e2e/passkey-stack/stack-env.js >> "$GITHUB_ENV"

      - name: Start the alto bundler
        run: bash scripts/e2e/passkey-stack/start-alto.sh

      - name: Start the relay gateway
        env:
          PORT: '8788'
          ENABLED_CHAIN_IDS: '80002'
          RPC_URLS_80002: 'http://127.0.0.1:8545'
          # The SPA is a different origin from the gateway, so the browser's POST /v1/paymaster is
          # cross-origin and dies at CORS without this — while the server-side call in the readiness
          # check would have succeeded, which is exactly the shape of failure that looks like a
          # broken feature and is a missing header.
          ALLOWED_ORIGINS: 'http://localhost:5173'
          # Hardhat's published test account #9 — see the note on the deploy step above. Never a real key.
          PM_SIGNER_PRIVATE_KEY: '0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6'
        run: |
          mkdir -p /tmp/fairwins-passkey-stack
          export DEPLOYMENTS_DIR="$PASSKEY_DEPLOYMENTS_DIR"
          export PAYMASTER_ADDRESS_80002="$PASSKEY_PAYMASTER"
          export ENTRYPOINT_V06_80002="$PASSKEY_ENTRYPOINT"
          node services/relay-gateway/src/server.js > /tmp/relay-gateway.log 2>&1 &
          echo $! > /tmp/fairwins-passkey-stack/gateway.pid
          echo "gateway pid $(cat /tmp/fairwins-passkey-stack/gateway.pid)"

      # CONTENT, not status codes. A 200 from a bundler proves only that something is listening —
      # the origin-lock nginx in front of production alto serves its own 200 that never reaches
      # alto, and that is the check that stayed green through the 2026-07-12 stall. Every assertion
      # here is documented in the script.
      - name: Wait for the passkey stack
        env:
          CHAIN_ID: '80002'
          ENTRYPOINT: ${{ env.PASSKEY_ENTRYPOINT }}
          ACCOUNT_FACTORY: ${{ env.PASSKEY_ACCOUNT_FACTORY }}
          PAYMASTER: ${{ env.PASSKEY_PAYMASTER }}
          ALTO_URL: 'http://127.0.0.1:4337'
          GATEWAY_URL: 'http://127.0.0.1:8788'
        run: node scripts/e2e/passkey-stack/wait-for-stack.js

      # `dev:e2e:passkey`, not `dev:e2e`: the bundler and sponsor-paymaster URLs are compiled in.
      # No --browser flag, matching the other two tiers — the default Electron runner is
      # chromium-family, which is what the CDP virtual-authenticator ceremonies require.
      - name: Run passkey full-stack E2E tests
        working-directory: frontend
        env:
          CYPRESS_NETWORK_ID: '80002'
          CYPRESS_PASSKEY_ENABLED: '1'
          CYPRESS_PASSKEY_FULL_STACK: '1'
          CYPRESS_GATEWAY_URL: 'http://127.0.0.1:8788'
          CYPRESS_GATEWAY_PID_FILE: '/tmp/fairwins-passkey-stack/gateway.pid'
        run: |
          set -o pipefail
          npx start-server-and-test dev:e2e:passkey http://localhost:5173 \
            'cypress run --spec "cypress/e2e/passkey/controllers.cy.js,cypress/e2e/passkey/recovery.cy.js,cypress/e2e/passkey/sponsored-userop.cy.js,cypress/e2e/passkey/membership-purchase.cy.js,cypress/e2e/passkey/vault-create-batch.cy.js"' \
            2>&1 | tee cypress-passkey-output.txt

      - name: Summarize passkey E2E results
        if: always()
        working-directory: frontend
        run: |
          echo "### Cypress Passkey Full Stack (bundler + paymaster)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-passkey-output.txt > cypress-passkey-plain.txt
          TOTALS=$(grep -E "(All specs passed!|[0-9]+ of [0-9]+ failed)" cypress-passkey-plain.txt | tail -1)
          if [ -n "$TOTALS" ]; then
            echo "\`$(echo "$TOTALS" | tr -d '│' | xargs)\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Cypress produced no run-total row — see the job log." >> $GITHUB_STEP_SUMMARY
          fi

      # Two-part gate, as on both other tiers: the run step's exit code is authoritative for
      # pass/fail but cannot tell us the run never started. Both matches read the DE-COLOURED copy,
      # because cypress wraps these lines in escape codes and grepping the raw file cannot fire.
      - name: Check passkey E2E results
        if: always()
        working-directory: frontend
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' cypress-passkey-output.txt > cypress-passkey-plain.txt

          if ! grep -qE "Run Finished" cypress-passkey-plain.txt; then
            echo "::error::Cypress never reached 'Run Finished' — the run died before completing. Failing rather than assuming success."
            exit 1
          fi

          if grep -qE "[0-9]+ of [0-9]+ failed" cypress-passkey-plain.txt; then
            echo "::error::Cypress reported failing specs in the passkey full-stack tier."
            grep -E "[0-9]+ of [0-9]+ failed" cypress-passkey-plain.txt
            exit 1
          fi

          # A PENDING test in THIS tier is a failure of the tier's purpose: every spec here is
          # gated on PASSKEY_FULL_STACK, which this job sets, so anything still skipping means the
          # stack did not come up in a way the spec recognised — which is precisely the state
          # (#1271) this job exists to end. Reported loudly rather than as a green run of nothing.
          if grep -qE "^ *│ *Pending: *[1-9]" cypress-passkey-plain.txt; then
            echo "::error::Tests were PENDING in the passkey full-stack tier — the stack is up but specs skipped themselves."
            grep -E "Pending:" cypress-passkey-plain.txt
            exit 1
          fi

      - name: Capture service logs
        if: always()
        run: |
          docker logs fairwins-e2e-alto > /tmp/alto.log 2>&1 || echo "no alto container" > /tmp/alto.log

      - name: Upload stack logs
        uses: actions/upload-artifact@v7
        # Only interesting when something broke — and then they are the whole diagnosis: which of
        # the four services refused, and why.
        if: failure()
        with:
          name: cypress-passkey-stack-logs
          path: |
            /tmp/hardhat-node.log
            /tmp/alto.log
            /tmp/alto-proxy.log
            /tmp/relay-gateway.log
          retention-days: 7

      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-passkey-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-passkey-videos
          path: frontend/cypress/videos
          retention-days: 7

      - name: Upload Cypress output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-passkey-results
          path: frontend/cypress-passkey-output.txt
          retention-days: 7
