name: Release

# Publishes a release from `main` (spec 076, FR-004/FR-021/FR-033/FR-037).
#
# The version is NOT computed here. `scripts/release/version.js` is the single authority for that
# (FR-015) — this workflow asks it, and hands the answer to Release Drafter as an explicit `version:`
# input. `.github/release-drafter.yml` deliberately has no `version-resolver:` block: two systems
# that must agree about what a classification means will eventually disagree, and one cannot.
#
# Three behaviours are deliberate and each is asserted below rather than assumed:
#   · An EMPTY commit range publishes NOTHING (FR-021). It does not re-tag the current version.
#   · A tag that already exists is a hard failure (FR-004). Tags are immutable; a workflow that
#     force-updates one destroys the only durable record of what shipped.
#   · The whole job is skipped for the CHANGELOG commit it makes itself, or it would loop.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Never two releases at once — they would race for the same tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # `write`, not `read`: the final step OPENS a pull request for the generated release record
  # (github.rest.pulls.create). With `read` the token 403s at runtime and the release job fails at
  # its last step — the precise failure this PR exists to remove. Reported by review on #1088.
  pull-requests: write
  # Workload-identity auth for the Android signing secrets (spec 102). Unused
  # until the ANDROID_SIGNING_SERVICE_ACCOUNT repo variable is set.
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Native release channels (spec 102, contracts/release-artifacts.md).
  #
  # ORDER IS THE CONTRACT: the artifact and smoke jobs run BEFORE the tag is
  # created, and the `release` job `needs` all four — so a record row can only
  # ever describe an artifact that was built AND smoke-tested (FR-009), and a
  # failed native build means no tag, no release, loudly. None of these jobs
  # carries `continue-on-error` (constitution IV).
  #
  # The version is computed ONCE here from the same SHA the release job will
  # read — scripts/release/version.js is deterministic over git state, so the
  # two agree by construction (FR-015).
  # ---------------------------------------------------------------------------
  native-gate:
    name: Native channels gate
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compute the release version for the native builds
        id: gate
        run: |
          set -euo pipefail
          node scripts/release/version.js --json > version.json
          VERSION=$(node -p "require('./version.json').version || ''")
          if [ -z "$VERSION" ]; then
            echo "::notice::No release from this push — native channel builds are not needed."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  android-artifact:
    name: Android artifact (.aab)
    runs-on: ubuntu-latest
    needs: native-gate
    if: needs.native-gate.outputs.proceed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # The SAME preparation `native-build.yml` runs on every pull request and
      # push to staging — one definition, so an early check can never pass while
      # the release it protects fails.
      - uses: ./.github/actions/native-prepare
        with:
          platform: android
          version: ${{ needs.native-gate.outputs.version }}
      # JAVA 21, not 17: `capacitor-android` (Capacitor 8) declares source/target
      # compatibility 21, and javac answers an older toolchain with
      # `invalid source release: 21` — which is what failed every Android job on
      # the v1.16.0 attempt, the first time this chain ever ran.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Signing is enabled by setting the ANDROID_SIGNING_SERVICE_ACCOUNT repo
      # variable (one-time operator setup — docs/runbooks/native-release-operations.md).
      # Once enabled, a missing or unreadable secret FAILS this job naming it;
      # until enabled, the build is UNSIGNED and the record row says so — the
      # one thing that never happens is silent half-signing. Key material rides
      # the ENVIRONMENT into gradle (never argv, never a committed property
      # file); the keystore is materialised only into the ephemeral runner temp.
      - name: Authenticate for the upload key
        if: vars.ANDROID_SIGNING_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.ANDROID_SIGNING_SERVICE_ACCOUNT }}
      - name: Build the release bundle
        run: |
          set -euo pipefail
          if [ -n "${{ vars.ANDROID_SIGNING_SERVICE_ACCOUNT }}" ]; then
            KS="$RUNNER_TEMP/upload-keystore.jks"
            gcloud secrets versions access latest \
              --secret=fairwins-android-upload-keystore --out-file="$KS"
            KS_PASS="$(gcloud secrets versions access latest \
              --secret=fairwins-android-upload-keystore-password)"
            echo "::add-mask::$KS_PASS"
            cd frontend/android
            ANDROID_UPLOAD_KEYSTORE_FILE="$KS" \
            ANDROID_UPLOAD_KEYSTORE_PASSWORD="$KS_PASS" \
              ./gradlew --no-daemon bundleRelease
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_SIGNING_SERVICE_ACCOUNT is not set — building an UNSIGNED bundle. The record row will say signed: false. One-time setup: docs/runbooks/native-release-operations.md."
            cd frontend/android
            ./gradlew --no-daemon bundleRelease
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
      - name: Record the artifact digest
        run: |
          set -euo pipefail
          VERSION="${{ needs.native-gate.outputs.version }}"
          OUT="FairWins-${VERSION}.aab"
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          printf '{ "channel": "android", "artifact": "%s", "sha256": "%s", "signed": %s }\n' \
            "$OUT" "$SHA" "$SIGNED" > android.digest.json
          cat android.digest.json
      - uses: actions/upload-artifact@v7
        with:
          name: native-artifact-android
          path: FairWins-*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-digest-android
          path: android.digest.json
          if-no-files-found: error

  ios-artifact:
    name: iOS artifact (unsigned archive)
    runs-on: macos-latest
    needs: native-gate
    if: needs.native-gate.outputs.proceed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Same shared preparation as the Android jobs and the pre-main check,
      # including selecting the newest Xcode on the image.
      - uses: ./.github/actions/native-prepare
        with:
          platform: ios
          version: ${{ needs.native-gate.outputs.version }}
      # Unsigned by design: the Apple distribution identity is operator-held
      # and never enters CI (research R8). The archive's digest still pins the
      # released bytes; signing rewrites the bundle at the operator ceremony.
      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project frontend/ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Record the artifact digest
        run: |
          set -euo pipefail
          VERSION="${{ needs.native-gate.outputs.version }}"
          OUT="FairWins-${VERSION}-ios.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/App.xcarchive" "$OUT"
          SHA=$(shasum -a 256 "$OUT" | cut -d' ' -f1)
          printf '{ "channel": "ios", "artifact": "%s", "sha256": "%s", "signed": false }\n' \
            "$OUT" "$SHA" > ios.digest.json
          cat ios.digest.json
      - uses: actions/upload-artifact@v7
        with:
          name: native-artifact-ios
          path: FairWins-*-ios.xcarchive.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: native-digest-ios
          path: ios.digest.json
          if-no-files-found: error

  native-smoke-android:
    name: Native smoke (Android emulator)
    runs-on: ubuntu-latest
    needs: native-gate
    if: needs.native-gate.outputs.proceed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # The SAME preparation `native-build.yml` runs on every pull request and
      # push to staging — one definition, so an early check can never pass while
      # the release it protects fails.
      - uses: ./.github/actions/native-prepare
        with:
          platform: android
          version: ${{ needs.native-gate.outputs.version }}
      # JAVA 21, not 17: `capacitor-android` (Capacitor 8) declares source/target
      # compatibility 21, and javac answers an older toolchain with
      # `invalid source release: 21` — which is what failed every Android job on
      # the v1.16.0 attempt, the first time this chain ever ran.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # What this smoke PROVES: the bundled app installs, launches, renders the
      # shell (the `[fw-smoke] shell-mounted` marker reaches logcat via
      # Capacitor's console bridge), and survives a background/foreground cycle
      # without a fatal exception. The app-lock re-prompt itself is pinned at
      # unit level (src/test/applock) and by the staged manual protocol — a
      # fresh emulator has no signed-in member to lock, and pretending
      # otherwise would be coverage that cannot fail (spec 094).
      - name: Launch and probe the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          # ONE LINE, deliberately. This action runs its `script:` line by line,
          # each in its own `sh -c`, so shell variables do not survive between
          # lines and a multi-line `for`/`if` is split mid-statement. The probe
          # therefore lives in a file that a real shell reads whole.
          script: bash scripts/native/android-smoke.sh

  native-smoke-ios:
    name: Native smoke (iOS simulator)
    runs-on: macos-latest
    needs: native-gate
    if: needs.native-gate.outputs.proceed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      # Same shared preparation as the Android jobs and the pre-main check,
      # including selecting the newest Xcode on the image.
      - uses: ./.github/actions/native-prepare
        with:
          platform: ios
          version: ${{ needs.native-gate.outputs.version }}
      # The simulator is CHOSEN FROM THE IMAGE, never named in advance: a hardcoded
      # `iPhone 15` broke the moment the runner moved to an Xcode 26 image whose
      # newest simulators are iPhone 17s. Pick the last available iPhone by UDID
      # and build for exactly that device, so the thing built and the thing booted
      # cannot disagree.
      - name: Build for the simulator and probe the app
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
                p=[x for r in d.values() for x in r if x['name'].startswith('iPhone')]; \
                print(p[-1]['udid'] if p else '')")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator is available on this image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcodebuild \
            -project frontend/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          BUNDLE_ID=$(grep -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+' frontend/ios/App/App.xcodeproj/project.pbxproj | head -1 | sed 's/.*= //')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'App.app' | head -1)
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > console.log 2>&1 &
          MOUNTED=false
          for i in $(seq 1 60); do
            if grep -q 'fw-smoke.*shell-mounted' console.log; then MOUNTED=true; break; fi
            sleep 2
          done
          if [ "$MOUNTED" != "true" ]; then
            echo "::error::The app shell never mounted in the simulator WebView — console tail follows."
            tail -150 console.log || true
            exit 1
          fi
          echo "Smoke passed: built, installed, mounted on the simulator."
  release:
    name: Publish release
    runs-on: ubuntu-latest
    # Spec 102: the tag and record exist only if every native channel built and
    # smoked (FR-009). A push that mints no version skips the native jobs and
    # therefore this job too — same outcome as the internal gate below, one
    # step earlier.
    needs: [android-artifact, ios-artifact, native-smoke-android, native-smoke-ios]
    # A cheap short-circuit, and NOT the guard that holds.
    #
    # `head_commit` is the tip of the push. The CHANGELOG commit reaches `main` inside a pull
    # request (see "Prepare the changelog and manifest commit" below), so the tip of that push is
    # the MERGE commit — "Merge pull request #NNNN from …/release/vX.Y.Z-changelog" — and the
    # marker one commit deeper is invisible here. This condition was the only defence, and the
    # train ran on itself: v1.5.6 was cut from the merge of the v1.5.5 record and v1.5.7 from the
    # merge of the v1.5.6 one, three versions with no product change in them.
    #
    # Broadening it to `github.event.commits.*.message` would be worse than useless — a promotion
    # that back-merged a record would then skip the whole release. The marker is honoured where a
    # commit's worth is actually decided, per-commit, in scripts/release/classify.js.
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history AND tags: the version is computed from the commit range since the last
          # tag, so a shallow clone would silently produce a wrong answer rather than an error.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A squashed promotion collapses every PR title in the release into one subject, so the
      # version would be computed from a single classification instead of all of them (research R6).
      # This does not block — the merge has already happened — but it says loudly that the release
      # about to be cut may understate what shipped.
      - name: Warn if a promotion arrived squashed
        run: |
          set -euo pipefail
          PARENTS=$(git rev-list --parents -n 1 HEAD | wc -w)
          SUBJECT=$(git log -1 --format=%s)
          if [ "$PARENTS" -lt 3 ] && printf '%s' "$SUBJECT" | grep -qiE '^(merge )?(pull request )?.*staging'; then
            echo "::warning::This looks like a SQUASHED promotion from staging."
            echo "::warning::Promotions must use a merge commit (spec 076, research R6) or the release"
            echo "::warning::version is computed from one collapsed subject instead of every PR in it."
          fi

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail
          node scripts/release/version.js --explain | tee version-explain.txt
          node scripts/release/version.js --json > version.json
          VERSION=$(node -p "require('./version.json').version || ''")
          REASON=$(node -p "require('./version.json').reason")
          PREVIOUS=$(node -p "require('./version.json').previous || ''")
          {
            echo "version=$VERSION"
            echo "reason=$REASON"
            echo "previous=$PREVIOUS"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release version"
            echo ""
            echo '```'
            cat version-explain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # FR-021. A promotion that introduces no new commits must not mint a version — a release
      # record describing nothing is worse than no record.
      - name: Stop when there is nothing to release
        id: gate
        run: |
          if [ -z "${{ steps.version.outputs.version }}" ]; then
            echo "::notice::No release: ${{ steps.version.outputs.reason }}"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # FR-004. Published tags are immutable. If this fires, something already released this
      # version and the right response is to investigate, never to force the tag.
      - name: Refuse to move or reuse an existing tag
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists. Published tags are immutable (spec 076 FR-004)."
            echo "::error::This means a release already claimed this version. Do not force-update it."
            exit 1
          fi

      - name: Create and push the tag
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Build the artifact table
        if: steps.gate.outputs.proceed == 'true'
        id: artifacts
        run: |
          set -euo pipefail
          # Every artifact category is listed, INCLUDING the ones that did not move (FR-035):
          # a missing row is indistinguishable from an unexamined one.
          node scripts/release/artifacts.js \
            --previous "${{ steps.version.outputs.previous }}" \
            --version "${{ steps.version.outputs.version }}" \
            --out artifacts.md
          cat artifacts.md >> "$GITHUB_STEP_SUMMARY"

      # Spec 102: fold the native channel digests into the artifact table
      # BEFORE the changelog is generated, so the record carries them. The
      # `needs` above guarantees these artifacts were built and smoked.
      - name: Collect native channel digests
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: native-digest-*
          path: native-digests
      - name: Append native channel rows to the artifact table
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          node scripts/release/native-artifact-rows.js \
            --digests native-digests \
            --version "${{ steps.version.outputs.version }}" \
            --append artifacts.md
          tail -12 artifacts.md >> "$GITHUB_STEP_SUMMARY"

      # Release Drafter writes the NOTES. The version is supplied, never resolved here (FR-015).
      - name: Publish the release
        if: steps.gate.outputs.proceed == 'true'
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append the artifact table to the release body
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // Read the table from disk rather than threading it through a step output: the table is
            // multi-line markdown and round-tripping it through shell quoting is where this kind of
            // step usually breaks.
            const fs = require('fs')
            const table = fs.readFileSync('artifacts.md', 'utf8')
            const release_id = Number('${{ steps.drafter.outputs.id }}')
            const { data } = await github.rest.repos.getRelease({ ...context.repo, release_id })
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id,
              body: `${data.body || ''}\n\n${table}`,
            })

      # FR-037: the changelog is produced by the release process, never hand-written.
      # FR-037 + FR-007a. This commit lands via a PULL REQUEST, not a push to main.
      #
      # It used to `git push origin HEAD:main`, and that failed on every one of the first seven
      # releases once branch protection arrived:
      #
      #   remote: error: GH013: Repository rule violations found for refs/heads/main.
      #   - Changes must be made through a pull request.
      #   - 2 of 2 required status checks are expected.
      #
      # The alternative was a ruleset bypass for the bot. Opening a PR was chosen instead: the
      # protection on the branch that deploys to members stays intact with no exception, and the
      # generated commit gets the same checks as anything else. The cost is a small PR per release.
      - name: Prepare the changelog and manifest commit
        if: steps.gate.outputs.proceed == 'true'
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/${VERSION}-changelog"

          # RANGE START COMES FROM THE CHANGELOG, NOT THE LAST TAG.
          #
          # The tag is published immediately and immutably; the in-repo record only lands when its
          # pull request is merged. Those are not the same event, and deriving the range from the
          # tag assumes they are. When a record is not merged before the next push, a tag-derived
          # range starts AFTER commits that were never written down, and they are lost silently.
          #
          # That is not hypothetical: v1.2.4's entry is gone, and by 2026-08-10 the CHANGELOG sat at
          # v1.2.5 while v1.5.1 was tagged — ten versions of drift, because ten records were open at
          # once and conflicting.
          #
          # Starting from what the CHANGELOG actually contains makes the record self-healing: a
          # missed merge widens the next range instead of dropping its contents. It is also what
          # makes closing superseded records safe.
          TAG_PREV="${{ steps.version.outputs.previous }}"
          DOC_PREV="$(grep -oE '^## \[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' || true)"
          [ -n "$DOC_PREV" ] && case "$DOC_PREV" in v*) : ;; *) DOC_PREV="v$DOC_PREV" ;; esac
          PREV="$TAG_PREV"
          if [ -n "$DOC_PREV" ] && git rev-parse -q --verify "refs/tags/$DOC_PREV" >/dev/null; then
            # Widen to whichever is the ANCESTOR — never narrow the range.
            if [ -n "$TAG_PREV" ] && git merge-base --is-ancestor "$DOC_PREV" "$TAG_PREV" 2>/dev/null; then
              PREV="$DOC_PREV"
              echo "::notice::CHANGELOG is behind the tags ($DOC_PREV < $TAG_PREV) — widening the range to $PREV so unmerged records are recovered rather than lost."
            fi
          fi

          node scripts/release/changelog.js \
            --version "$VERSION" \
            --previous "$PREV" \
            --artifacts artifacts.md

          # Sync the repository version into every non-mini-app manifest (FR-007a). The tracked list
          # is DERIVED from the workspace globs, so it cannot fall behind the workspace. Mini-apps
          # version independently and are deliberately untouched (FR-007).
          node scripts/release/sync-manifest-versions.js --version "$VERSION"

          # ...and into the native shells (spec 103). Those version fields are SYNC-ONLY —
          # `check:native-versions` fails on any value the sync would not have written — so a
          # record that bumps the manifests without also running this is born unmergeable. It
          # was: v1.16.0's record failed the gate with drift in build.gradle and project.pbxproj,
          # because this step predates the native channels and was never extended when they
          # landed. The shipped artifacts were never affected (`native-prepare` runs the same
          # sync before building), which is exactly why nothing caught it earlier: the only
          # place the omission shows up is the committed record.
          node scripts/native/sync-native-config.js --version "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): ${VERSION} [skip release]"

          # `--force-with-lease` compares against refs/remotes/origin/$BRANCH, so that ref has to
          # exist for the lease to mean anything. `fetch-depth: 0` above does fetch every branch
          # today — but relying on that couples this push to a checkout implementation detail, and
          # anyone shrinking fetch-depth for speed would silently turn the lease into a no-op
          # ("stale info" rejection) exactly on the re-run path it exists to protect.
          #
          # So fetch it explicitly when it exists. `ls-remote` is a question, not a swallowed
          # failure: a genuine transport error still fails the step under `set -e`.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          fi
          git push origin "$BRANCH" --force-with-lease
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open the release-record pull request
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}'
            const head = '${{ steps.changelog.outputs.branch }}'
            const body = [
              `Generated release record for **${version}**.`,
              '',
              'Produced by `.github/workflows/release.yml` — the changelog and the manifest versions',
              'are generated, never hand-written (spec 076, FR-037/FR-007a). Review and merge; there',
              'is nothing to edit here.',
              '',
              `The tag \`${version}\` and its GitHub Release are already published and immutable —`,
              'this pull request only brings the in-repo record into line with them.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')

            // A re-run of the same release reuses its branch, so reuse the open PR too rather than
            // failing on "a pull request already exists".
            const existing = await github.rest.pulls.list({
              ...context.repo, state: 'open', head: `${context.repo.owner}:${head}`,
            })
            if (existing.data.length > 0) {
              core.notice(`Release-record PR already open: #${existing.data[0].number}`)
              return
            }

            /*
             * CLOSE SUPERSEDED RECORDS BEFORE OPENING A NEW ONE.
             *
             * This job runs on every push to main, and each run computes a new version, branches
             * `release/<version>-changelog` from main, and opens a PR. Nothing closed the previous
             * one. Measured 2026-08-10: TEN open release PRs (v1.2.6 through v1.5.1), most of them
             * CONFLICTING with each other because every one edits CHANGELOG.md and the same
             * manifests — and because each was branched from a main that never received the
             * earlier entries, none of them was cumulative.
             *
             * The damage was not cosmetic. The tags were published and immutable while the in-repo
             * record sat ten versions behind, and v1.2.4's entry was lost outright: its PR was
             * closed or superseded before merge and nothing preserved what it said.
             *
             * A superseded record is genuinely redundant ONLY because the new one is generated for
             * a range starting at the last version in CHANGELOG.md rather than the last tag (see
             * the `--previous` argument above). If that ever reverts to tag-derived, closing these
             * would start destroying entries again.
             */
            const stale = await github.rest.pulls.list({ ...context.repo, state: 'open', base: 'main' })
            for (const pr of stale.data) {
              if (!/^chore\(release\): /.test(pr.title)) continue
              if (!/^release\/.*-changelog$/.test(pr.head.ref)) continue
              if (pr.head.ref === head) continue
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.number,
                body:
                  `Superseded by the release record for **${version}**, which covers this range too.\n\n` +
                  'Closing so release records cannot accumulate and conflict with one another — see the ' +
                  'note in `.github/workflows/release.yml`.',
              })
              await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: 'closed' })
              core.notice(`Closed superseded release-record PR #${pr.number} (${pr.title})`)
            }
            const pr = await github.rest.pulls.create({
              ...context.repo,
              title: `chore(release): ${version}`,
              head,
              base: 'main',
              body,
            })
            core.notice(`Opened release-record PR #${pr.data.number} for ${version}`)

            /*
             * A PR OPENED BY GITHUB_TOKEN GETS NO CHECKS, SO IT CAN NEVER MERGE.
             *
             * GitHub deliberately does not fire workflow events for actions taken with the default
             * GITHUB_TOKEN — it is how recursive workflow loops are prevented. The consequence here
             * is that this pull request is created with ZERO check runs, and every required status
             * check sits at "Expected — waiting for status to be reported" forever.
             *
             * Measured on #1120: 0 checks reported, mergeable=MERGEABLE but mergeStateStatus=BLOCKED,
             * and `gh pr merge` refused with "the base branch policy prohibits the merge". A
             * close/reopen (a real user token) took it from 0 to 23 checks immediately.
             *
             * So the record is born unmergeable, which is how the changelog fell ten versions behind
             * the tags and lost v1.2.4 (#1119). #1121 taught the promotion rule to ADMIT this branch;
             * that fix is necessary but not sufficient, because the checks never ran at all.
             *
             * Closing and reopening from the same token does NOT help — the exemption is per-token,
             * not per-action. The durable fix is to create the PR with an App or PAT token; until one
             * is provisioned this says so loudly rather than leaving a silently stuck PR, because a
             * blocked release record looks identical to one nobody has got round to merging.
             */
            const checks = await github.rest.checks.listForRef({
              ...context.repo, ref: pr.data.head.sha, per_page: 1,
            })
            if (checks.data.total_count === 0) {
              core.warning(
                `Release-record PR #${pr.data.number} has NO check runs, because GITHUB_TOKEN does not ` +
                'trigger workflow events. Required checks will never report and the PR cannot merge. ' +
                'Close and REOPEN it by hand to fire the events, or provision an App/PAT token for ' +
                'this step. See the note in .github/workflows/release.yml.'
              )
              await github.rest.issues.createComment({
                ...context.repo, issue_number: pr.data.number,
                body:
                  '> **This PR has no checks and cannot merge as-is.**\n>\n' +
                  '> It was opened by `GITHUB_TOKEN`, and GitHub does not fire workflow events for that ' +
                  'token, so no required status check will ever report. **Close and reopen this PR** to ' +
                  'trigger them.\n>\n' +
                  '> The durable fix is an App or PAT token for the PR-creation step in ' +
                  '`.github/workflows/release.yml`.',
              })
            }
