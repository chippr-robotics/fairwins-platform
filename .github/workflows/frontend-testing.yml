name: Frontend Testing and Accessibility Audits

on:
  # No `branches:` filter — see subgraph-build.yml. This workflow runs the FULL frontend suite,
  # which is a superset of ci-manager's; restricting it to main/develop meant a PR into a feature
  # branch was reviewed against the smaller set. That is how the addressBookCrypto AEAD flake
  # (#1032) reached 075: the PR fixing it could not run the workflow that caught it.
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches:
      - main
      # spec 076 FR-022: `develop` never existed on the remote; `staging` is the real one.
      - staging
    paths:
      - 'frontend/**'
  workflow_dispatch:

# Supersede in-flight runs for the same ref (spec 075, FR-010). Without this, pushing a
# follow-up commit leaves the previous pipeline running to completion, which is where a large
# share of this repo's runner time went.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run unit tests
        # `set -o pipefail` is REQUIRED: piping into `tee` otherwise makes the step's exit
        # status tee's (always 0), silently discarding this gate's failures (spec 075).
        run: |
          set -o pipefail
          npm test -- --run --reporter=verbose 2>&1 | tee test-output.txt
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TZ: UTC

      - name: Summarize test results
        if: always()
        run: |
          echo "### Frontend Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TESTS_LINE=$(grep "Tests" test-output.txt | tail -1 || echo "")
          FILES_LINE=$(grep "Test Files" test-output.txt | tail -1 || echo "")
          DURATION_LINE=$(grep "Duration" test-output.txt | tail -1 || echo "")
          if [ -n "$FILES_LINE" ]; then
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| $FILES_LINE |" | sed 's/^.*Test Files/| Test Files |/' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo "| $TESTS_LINE |" | sed 's/^.*Tests/| Tests |/' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo "| $DURATION_LINE |" | sed 's/^.*Duration/| Duration |/' >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # Coverage report generation can fail due to environment issues without indicating
      # actual test failures. We allow this to fail gracefully while still uploading
      # whatever coverage data was generated.
      - name: Generate coverage report
        run: npm run test:coverage -- --run
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          TZ: UTC

      - name: Summarize coverage
        if: always()
        run: |
          echo "### Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage/coverage-summary.json" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              console.log('Statements: ' + c.statements.pct + '%');
              console.log('Branches:   ' + c.branches.pct + '%');
              console.log('Functions:  ' + c.functions.pct + '%');
              console.log('Lines:      ' + c.lines.pct + '%');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      # No coverage upload here. test.yml's `frontend-test-coverage` uploads the SAME
      # path (frontend/coverage/) on the same push — two 7.4 MB copies of one report.
      # The percentages land in the step summary above either way, so this job keeps
      # the summary and test.yml keeps the artifact.

  lighthouse-audit:
    name: Lighthouse Accessibility Audit
    runs-on: ubuntu-latest
    needs: unit-tests
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.0

      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found after build"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found after build"
            exit 1
          fi
          echo "Build output verified. Contents of dist:"
          ls -la dist/
          echo "Checking index.html:"
          head -20 dist/index.html

      # Spec 094: BOTH profiles, over one shared route list (frontend/lighthouse-routes.json) so
      # desktop and mobile cannot drift apart. lhci takes a single `settings.preset` per run, which
      # is why this is two configs rather than one.
      #
      # Neither run blocks on a budget — a Lighthouse score on a shared runner moves several points
      # between runs, and a gate that mostly reports the runner is one people learn to re-run.
      # `continue-on-error` is deliberately NOT used: the assertions are `warn`-level in the config
      # itself, so lhci exits 0 on a budget miss but still fails on a run that could not execute.
      # `lhci collect` always writes its lhr-*.json into `.lighthouseci/`, so the two profiles are
      # separated by moving each run's reports into a profile directory before the next run starts.
      # Doing it in shell rather than trusting a flag keeps the layout something a reader can verify
      # from the job log — and it is the layout the coverage check below reads.
      - name: Run Lighthouse CI (desktop)
        run: |
          lhci autorun --config=lighthouserc.desktop.json
          mkdir -p .lighthouseci/desktop
          mv .lighthouseci/lhr-*.json .lighthouseci/desktop/
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__COMMIT_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Run Lighthouse CI (mobile)
        run: |
          lhci autorun --config=lighthouserc.mobile.json
          mkdir -p .lighthouseci/mobile
          mv .lighthouseci/lhr-*.json .lighthouseci/mobile/
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__COMMIT_TIME: ${{ github.event.head_commit.timestamp }}

      # The half that DOES block (FR-026). `lhci assert` only evaluates URLs it collected, so a
      # route that failed to load contributes nothing and leaves the job green — an unmeasured
      # route reported as a pass is the same defect as a green gate over a crashed run.
      - name: Every budgeted route was measured on both profiles
        run: node scripts/e2e/check-lighthouse-coverage.js
        working-directory: .

      - name: Summarize Lighthouse results
        if: always()
        run: |
          echo "### Lighthouse Scores" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # One row per route per profile. The previous version summarised the FIRST report it
          # found and presented it as "the" score — with six routes and two profiles that is one
          # twelfth of the measurement, reported as all of it.
          for PROFILE in desktop mobile; do
            echo "**${PROFILE}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Route | Perf | A11y | Best practices | SEO |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            for REPORT in $(find ".lighthouseci/$PROFILE" -name "lhr-*.json" -type f 2>/dev/null | sort); do
              node -e "
                const lhr = require('./$REPORT');
                const c = lhr.categories || {};
                const pct = (k) => c[k] ? Math.round(c[k].score * 100) : '—';
                const url = (lhr.requestedUrl || '').replace('http://localhost:4173', '') || '/';
                console.log('| ' + url + ' | ' + pct('performance') + ' | ' + pct('accessibility') +
                            ' | ' + pct('best-practices') + ' | ' + pct('seo') + ' |');
              " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          done
          echo "Budgets report rather than block; an unmeasured route fails the job." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # `include-hidden-files` is REQUIRED here and its absence was silent: `.lighthouseci` is a
      # dot-directory, upload-artifact@v7 excludes hidden paths by default, and the step logged
      # "No files were found with the provided path" as a WARNING while the job stayed green — so
      # this artifact has been uploading nothing. The reports are the evidence behind "budgets
      # report rather than block"; discarding them left the step summary as the only record.
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci/
          include-hidden-files: true
          retention-days: 7

  axe-audit:
    name: axe Accessibility Audit
    runs-on: ubuntu-latest
    needs: unit-tests
    
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'  # single root lockfile (spec 075)

      - name: Install dependencies
        run: npm ci --workspace frontend --include-workspace-root=false
        working-directory: .  # root install; the child has no lockfile (spec 075)

      - name: Run axe accessibility tests
        run: npm test -- --run accessibility.test
        continue-on-error: false

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Accessibility tests failed. Please review the axe audit results and fix any WCAG AA violations.'
            })

  deployment-ready:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [unit-tests, lighthouse-audit, axe-audit]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    
    steps:
      - name: Check all tests passed
        run: echo "All tests and audits passed. Ready for deployment."

      - name: Deployment summary
        run: |
          echo "### Deployment Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse audit | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| axe a11y audit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
