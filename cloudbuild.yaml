steps:
  # Build the Docker image
  # Note: VITE_PINATA_JWT is NOT passed as a build arg - it's injected at runtime
  # via Cloud Run environment variable from Secret Manager
  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    args:
      - 'build'
      # Tenant selection (spec 072): this pipeline builds the DEFAULT (fairwins)
      # instance. A per-tenant instance is the same pipeline with its own
      # VITE_TENANT_ID + tenant URLs and its own Cloud Run service — see
      # docs/runbooks/tenant-operations.md.
      # Stamps the nav drawer's build label so a bug report pins an exact commit (buildInfo.js).
      - '--build-arg'
      - 'VITE_COMMIT_SHA=$SHORT_SHA'
      - '--build-arg'
      - 'VITE_TENANT_ID=fairwins'
      - '--build-arg'
      - 'VITE_WALLETCONNECT_PROJECT_ID=c30d7d7a8d575fe3dcc72ed55e5b287e'
      - '--build-arg'
      - 'VITE_APP_URL=https://fairwins.app'
      - '--build-arg'
      # Gasless relayer (spec 036). The SPA probes this and self-submits if it's down (never-stranded).
      - 'VITE_RELAYER_URL=https://relay.fairwins.app'
      - '--build-arg'
      - 'VITE_NETWORK_ID=137'
      - '--build-arg'
      - 'VITE_RPC_URL=https://polygon-bor-rpc.publicnode.com'
      # Per-chain RPC primaries for the EVM mainnets. EMPTY BY DEFAULT and set on the TRIGGER, not
      # here: a QuickNode URL carries its token in the path, and committing one would put it in git
      # history where rotation cannot reach it. Empty falls through to the committed publicnode
      # primary + drpc failover in config/networks.js, so an unset trigger builds exactly what it
      # built before.
      #
      # ⚠ ONLY a DOMAIN-RESTRICTED QuickNode endpoint belongs here. VITE_ values compile into the
      # public bundle (spec 097 rule 5), so whatever is set is readable by every visitor — the fix
      # is an endpoint scoped to the app's origins, never a hiding place for the archive credential
      # the workstation reads (fairwins-quicknode-<chain>-url). Polygon 137 is deliberately absent:
      # it is the app's own chain and rides VITE_RPC_URL above.
      - '--build-arg'
      - 'VITE_RPC_URL_MAINNET=${_RPC_URL_MAINNET}'
      - '--build-arg'
      - 'VITE_RPC_URL_OPTIMISM=${_RPC_URL_OPTIMISM}'
      - '--build-arg'
      - 'VITE_RPC_URL_BASE=${_RPC_URL_BASE}'
      - '--build-arg'
      - 'VITE_RPC_URL_ARBITRUM=${_RPC_URL_ARBITRUM}'
      - '--build-arg'
      - 'VITE_IPFS_GATEWAY=https://gateway.pinata.cloud'
      # v2 WagerRegistry subgraph (Spec 017 / #707). Build-time only: Vite inlines
      # VITE_* at `npm run build`, so this is baked into the bundle — NOT a Cloud Run
      # runtime var. Public, non-secret URL. Must match VITE_NETWORK_ID above
      # (137 = Polygon -> fairwins-polygon). Studio dev query endpoint (rate-limited);
      # for production traffic, publish to the decentralized net + proxy the keyed
      # gateway URL via nginx (see the VITE_PINATA_JWT pattern).
      #
      # This is now only a legacy fallback (resolveSubgraphUrl in
      # frontend/src/data/wagers/SubgraphSource.js) — networks.js's per-chain
      # `subgraphUrl` for 137 is the value every reader actually resolves.
      # Kept pointed at the live version anyway so the fallback can never
      # silently diverge from it again (issue #1172: this was stuck on the
      # abandoned v0.2.0 while networks.js had already moved to v0.3.0).
      # Pin the exact version — never `/version/latest` (see networks.js).
      - '--build-arg'
      - 'VITE_SUBGRAPH_URL=https://api.studio.thegraph.com/query/1755381/fairwins-polygon/v0.3.0'
      - '--build-arg'
      - 'VITE_WAGER_SOURCE=subgraph'
      # Passkey smart accounts (spec 041): self-hosted alto ERC-4337 bundler, colocated with the
      # relay gateway (SC-009). Baked in at build; passkeyConfig(137) is null without it, so passkey
      # accounts stay disabled on Polygon until this is set. EntryPoint v0.6.
      - '--build-arg'
      # Cloudflare-fronted edge host (origin-lock ARMED 2026-07-06). Cloudflare injects X-Origin-Auth on
      # *.fairwins.app; the bare run.app URL now 403s (no header), so the SPA MUST use this host. CSP
      # connect-src already allows it (frontend/nginx.conf).
      - 'VITE_BUNDLER_URLS_POLYGON=https://bundler.fairwins.app'
      - '--build-arg'
      # Sponsored paymaster (spec 050): FairWins sponsors passkey UserOp gas on Polygon via the
      # relay-gateway's /v1/paymaster (verifying paymaster 0xe14554D14eB5DeC47f7824ebeeDa6C9f3A50d105,
      # KMS signer). Set => passkey transfers are gasless; unset => the account self-funds and the
      # confirm UI discloses the native fee honestly (never a false "sponsored").
      - 'VITE_SPONSOR_PAYMASTER_POLYGON=https://relay.fairwins.app/v1/paymaster'
      - '--build-arg'
      # Release identity (spec 076). $_APP_VERSION is set by the release workflow to the tag at this
      # commit; it is EMPTY for any build that is not a published release (a manual trigger, a
      # rebuild of an untagged commit), and the app then reports `unreleased+<sha>` rather than
      # claiming the nearest tag. Reporting a version the build is not would make every other
      # guarantee in spec 076 unreliable — see FR-031.
      - 'VITE_APP_VERSION=${_APP_VERSION}'
      - '--build-arg'
      - 'VITE_GIT_SHA=$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/prediction-dao-research:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/prediction-dao-research:latest'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker:20.10.24'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/prediction-dao-research']

  # Deploy to Cloud Run
  # The VITE_PINATA_JWT environment variable is already configured in Cloud Run
  # to be pulled from Secret Manager at runtime.
  # ORIGIN_LOCK_SECRET (Spec 007 origin lock, FR-008) is likewise configured on the
  # Cloud Run service from Secret Manager — see infra/cloudflare/origin-lock.md. It is
  # intentionally NOT set here so deploys don't fail before the secret exists; once it is
  # created, it can be wired declaratively with:
  #   - '--update-secrets'
  #   - 'ORIGIN_LOCK_SECRET=origin-lock-secret:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:588.0.0'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'prediction-dao-research'
      - '--image'
      - 'us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/prediction-dao-research:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

  # --- Alto ERC-4337 bundler — REMOVED, and it must stay removed ---------------------------------
  # This step used to build the origin-lock nginx image and `gcloud run services replace` the
  # 2-container bundler service on EVERY merge to main. It is deleted because the bundler is moving
  # to a GCE VM (infra/vm/, docs/runbooks/vm-migration.md), and the manifest it replaced from
  # (services/alto-bundler/deploy/service.yaml) still carries `minScale: "1"` and `ingress: all`.
  #
  # Leaving it in place would mean any merge to main SILENTLY RE-ARMS the Cloud Run bundler. Because
  # ALTO_EXECUTOR_PRIVATE_KEYS and ALTO_UTILITY_PRIVATE_KEY both resolve to the same secret
  # (alto-executor-key-137), that is a second executor on ONE EOA: colliding nonces, stuck bundles,
  # and — with ALTO_DEPLOY_SIMULATIONS_CONTRACT=true — a cold start that can emit a transaction from
  # that wallet. There is no in-band detection; both instances look healthy.
  #
  # infra/vm/bundler/single-alto-gate.sh detects the condition within 60s and refuses to run the VM's
  # alto, but it cannot PREVENT it — only the absence of this build step can.
  #
  # The inverse also holds: if the bundler is ever rolled BACK to Cloud Run, this step must be
  # restored (or the manifest re-armed by hand), or the rollback target will be silently disarmed by
  # the next merge. See the "inverted trap" section of the runbook.

  # --- Relay gateway (spec 036) — NOT built or deployed here -----------------------------------
  # The production relayer is a 3-CONTAINER Cloud Run service (policy gateway + from-source OZ
  # Relayer engine + redis) wired to a KMS-signed gas key. A single-container `gcloud run deploy`
  # from CI would CLOBBER it (drop the engine + redis sidecars), so the relayer is managed
  # OUT-OF-BAND (built from source, deployed via `gcloud run services replace`). See
  # docs/architecture/relayer-infrastructure.md and docs/runbooks/relayer-mordor-deploy.md.

images:
  - 'us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/prediction-dao-research:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/chippr-bots-site-wp/cloud-run-source-deploy/prediction-dao-research/prediction-dao-research:latest'

substitutions:
  # Release identity (spec 076). Declared with an EMPTY default on purpose: a Cloud Build trigger
  # firing on a main push has no way to know whether the release workflow has tagged that commit
  # yet, and guessing would produce a build that claims a release it may not be. Empty means the
  # app self-describes as `unreleased+<sha>`, which is the honest answer (FR-031). The release
  # workflow passes a real value when it builds a tagged commit.
  _APP_VERSION: ''

  # Per-chain RPC primaries (see the build args above). EMPTY defaults so the committed pipeline
  # never carries a credential and an unset trigger reproduces the previous bundle byte for byte.
  # Set these on the Cloud Build trigger once domain-restricted QuickNode endpoints exist —
  # docs/developer-guide/network-endpoints.md §"QuickNode per-chain endpoints".
  _RPC_URL_MAINNET: ''
  _RPC_URL_OPTIMISM: ''
  _RPC_URL_BASE: ''
  _RPC_URL_ARBITRUM: ''

# STATED rather than inherited. Cloud Build's implicit default is 600s; production builds one image
# and lands in ~3 minutes, so the default has never bitten here — but an implicit ceiling is one
# nobody has agreed to, and the first time it is reached it presents as a TIMEOUT on a build that
# was working. 20 minutes is ~6x the measured run. See cloudbuild.staging.yaml, which builds twice
# and was already using most of the default.
timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY
